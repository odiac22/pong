<script>
// ─── State ────────────────────────────────────────────────────────────────────
let videoUrls = [];
let allVideoUrls = [];
let allVideoMetadata = [];
let currentVideoIndex = 0;
let isControlsVisible = true;
let videoMetadata = [];
let currentBatch = 0;
let activePlaybackRange = null;
let currentLoadedRangeStart = 0;
let currentLoadedRangeEnd = 0;
let currentLoadedRangeIsFull = false;
const BATCH_SIZE = 20;
let currentRenderBatchSize = BATCH_SIZE;
let eromeBatchAutoAdvance = false;
let slidingPlaybackRespectsRange = false;
let eromeSlidingRenderPending = false;
const VIDEO_LOAD_RETRY_DELAYS_MS = [3000, 5000, 7000, 10000, 15000, 20000];
const VIDEO_LOAD_RETRY_POLL_MS = 1000;
let visibleBatchRetryTimer = null;
let visibleBatchRetryToken = 0;
let sessionSaveTimer = null;
let scrollThumbSuppressedUntil = 0;
const DECK_MODE_ENABLED = true;
let deckOrder = [];
let deckHistory = [];
let deckForwardHistory = [];
const DECK_HISTORY_LIMIT = 80;
const DECK_PRELOAD_RADIUS = 2;
const DECK_INITIAL_WARM_COUNT = 5;
const EROME_SESSION_SAVE_MIN_DELAY_MS = 6000;
const EROME_LARGE_SESSION_SAVE_MIN_DELAY_MS = 22000;
const EROME_LARGE_SESSION_URL_THRESHOLD = 600;
let deckCurrentIndex = -1;
let deckRestoreIndex = null;
let deckSwipeControllerInstalled = false;
let deckSwipeGesture = null;
let lastDeckSwipeAt = 0;
let deckNavigationLockedUntil = 0;
let deckAutoPromotionLockedUntil = 0;
let deckReadyPromotionTimer = null;
let deckLastEmptyNoticeAt = 0;
let viewedVideoKeys = new Set();

// ─── Paste tracking ───────────────────────────────────────────────────────────
let pasteEvents = [];
let currentPasteIndex = -1;
let paperclipRetiredBundleKeys = new Set();
let paperclipStepCount = 1;
let pendingPastes = [];
let _prevUrlCount = 0;
let parsedVideoUrlsCache = [];
let parsedVideoMetadataCache = [];
let parseCacheDirty = false;
let isHandlingPaste = false;
let ignoreNextPasteInput = false;
let lastVideoUrlsInputValue = '';
let mobilePasteSnapshotValue = '';
let mobilePastePending = false;
let mobilePasteSelectionStart = 0;
let mobilePasteSelectionEnd = 0;
let lastHandledPasteText = '';
let lastHandledPasteAt = 0;
let pasteParseQueue = [];
let pasteParseScheduled = false;
let pasteParsePromises = [];

const videoContainer = document.getElementById('video-container');
const videoUrlsInput  = document.getElementById('video-urls');
const loadVideosButton = document.getElementById('load-videos');
lastVideoUrlsInputValue = videoUrlsInput ? videoUrlsInput.value || '' : '';

function parseVideoUrls(text) {
  return parsePastedVideoLines(text).urls;
}

function isVideoUrlLine(line) {
  return line && line.length > 4 && !line.startsWith('#PONG_') && /\.(mp4|m4v|mov|webm)(\?|$)/i.test(line);
}

function parsePongJsonLine(line, prefix) {
  if (!line.startsWith(prefix)) return null;

  try {
    const parsed = JSON.parse(line.slice(prefix.length).trim());
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : null;
  } catch(e) {
    return null;
  }
}

function compactField(value) {
  return String(value || '').trim();
}

function compactArtistLineToMeta(line) {
  if (!line.startsWith('#PA|')) return null;

  const parts = line.slice(4).split('|');
  const meta = {
    type: 'artist',
    source: compactField(parts[0]) || 'coomerfans',
    artistKey: compactField(parts[1]),
    artistUrl: compactField(parts[2]),
    artistName: compactField(parts.slice(3).join('|')),
    scrapedAt: ''
  };

  const artistDisplayName = getArtistDisplayName(meta);
  return artistDisplayName ? { ...meta, artistDisplayName } : meta;
}

function compactVideoLineToMeta(line, activeArtist) {
  if (!line.startsWith('#PV|')) return null;

  const parts = line.slice(4).split('|');
  return {
    ...(activeArtist || {}),
    type: 'video',
    postUrl: compactField(parts[0]),
    postIndex: Number(compactField(parts[1]) || 0)
  };
}

function artistNameFromUrl(rawUrl) {
  if (!String(rawUrl || '').trim()) return '';

  try {
    const url = new URL(String(rawUrl || ''), window.location.href);
    const parts = url.pathname.split('/').map(part => part.trim()).filter(Boolean);
    const lastPart = parts.length ? decodeURIComponent(parts[parts.length - 1]) : '';
    return /^\d+$/.test(lastPart) ? '' : lastPart;
  } catch(e) {
    return '';
  }
}

function getArtistDisplayName(meta) {
  if (!meta) return '';

  const displayName =
    meta.artistDisplayName ||
    artistNameFromUrl(meta.artistUrl) ||
    String(meta.artistName || '').trim();

  if (!displayName || /^\d+$/.test(displayName) || displayName.toLowerCase() === 'pong') return '';

  return displayName;
}

function parsePastedVideoLines(text) {
  const urls = [];
  const metadata = [];
  let activeArtist = null;
  let pendingVideo = null;

  String(text || '').split('\n').forEach(rawLine => {
    const line = rawLine.trim();
    if (!line) return;

    const artistMeta = parsePongJsonLine(line, '#PONG_ARTIST ');

    if (artistMeta) {
      activeArtist = artistMeta;
      return;
    }

    const compactArtistMeta = compactArtistLineToMeta(line);

    if (compactArtistMeta) {
      activeArtist = compactArtistMeta;
      pendingVideo = null;
      return;
    }

    const videoMeta = parsePongJsonLine(line, '#PONG_VIDEO ');

    if (videoMeta) {
      pendingVideo = {
        ...(activeArtist || {}),
        ...videoMeta
      };
      return;
    }

    const compactVideoMeta = compactVideoLineToMeta(line, activeArtist);

    if (compactVideoMeta) {
      pendingVideo = compactVideoMeta;
      return;
    }

    if (!isVideoUrlLine(line)) return;

    const meta = {
      ...(activeArtist || {}),
      ...(pendingVideo || {}),
      videoUrl: line
    };
    const artistDisplayName = getArtistDisplayName(meta);

    urls.push(line);
    metadata.push(artistDisplayName ? { ...meta, artistDisplayName } : {});
    pendingVideo = null;
  });

  return { urls, metadata };
}

function updatePendingPasteButton() {
  const btn = document.getElementById('paste-nav-button');
  if (!btn) {
    updatePasteNavigationButton();
    return;
  }

  const pendingCount = getPendingPasteBundleCount();

  if (pendingCount) {
    btn.style.opacity = '0.74';
    btn.style.background = 'rgba(103,232,249,0.22)';
    btn.setAttribute('data-count', pendingCount + 'p');
  } else {
    btn.setAttribute('data-count', '0/0');
    btn.style.opacity = '0.2';
    btn.style.background = '';
  }
}

function getPendingPasteBundleCount() {
  return pendingPastes.length;
}

function getPendingPasteEntries() {
  return parsedVideoUrlsCache.map((url, index) => ({
    ...(parsedVideoMetadataCache[index] || {}),
    videoUrl: url
  }));
}

function syncPendingPasteCacheState() {
  const entries = getPendingPasteEntries();

  window.PongPendingPasteCache = {
    urls: parsedVideoUrlsCache.slice(),
    metadata: parsedVideoMetadataCache.slice(),
    pasteEvents: pendingPastes.slice(),
    entries
  };

  if (entries.length) {
    window.PongLastPastedEntries = entries;
  }
}

function recoverDirtyPasteCache() {
  if (!parseCacheDirty) return;

  if (parsedVideoUrlsCache.length) {
    parseCacheDirty = false;
    return;
  }

  const parsedExisting = parsePastedVideoLines(videoUrlsInput.value);
  parsedVideoUrlsCache = parsedExisting.urls;
  parsedVideoMetadataCache = parsedExisting.metadata;
  _prevUrlCount = parsedVideoUrlsCache.length;
  parseCacheDirty = false;
}

function insertTextAtVideoCursor(text) {
  const value = videoUrlsInput.value || '';
  const start = Number.isFinite(videoUrlsInput.selectionStart) ? videoUrlsInput.selectionStart : value.length;
  const end = Number.isFinite(videoUrlsInput.selectionEnd) ? videoUrlsInput.selectionEnd : start;
  let insertText = String(text || '');

  if (value && start === value.length && value[start - 1] !== '\n' && insertText && !insertText.startsWith('\n')) {
    insertText = '\n' + insertText;
  }

  const nextValue = value.slice(0, start) + insertText + value.slice(end);
  const nextCaret = start + insertText.length;

  videoUrlsInput.value = nextValue;
  videoUrlsInput.selectionStart = nextCaret;
  videoUrlsInput.selectionEnd = nextCaret;
  videoUrlsInput.scrollTop = videoUrlsInput.scrollHeight;
}

function replaceInsertedText(previousValue, currentValue, replacementText) {
  const previous = String(previousValue || '');
  const current = String(currentValue || '');
  let prefixLength = 0;

  while (
    prefixLength < previous.length &&
    prefixLength < current.length &&
    previous[prefixLength] === current[prefixLength]
  ) {
    prefixLength++;
  }

  let previousSuffix = previous.length;
  let currentSuffix = current.length;

  while (
    previousSuffix > prefixLength &&
    currentSuffix > prefixLength &&
    previous[previousSuffix - 1] === current[currentSuffix - 1]
  ) {
    previousSuffix--;
    currentSuffix--;
  }

  const insertedText = current.slice(prefixLength, currentSuffix);
  let replacement = String(replacementText || '');

  if (insertedText.startsWith('\n') && replacement && !replacement.startsWith('\n')) {
    replacement = '\n' + replacement;
  } else if (
    prefixLength > 0 &&
    current[prefixLength - 1] !== '\n' &&
    replacement &&
    !replacement.startsWith('\n')
  ) {
    replacement = '\n' + replacement;
  }

  const nextValue = current.slice(0, prefixLength) + replacement + current.slice(currentSuffix);
  const nextCaret = prefixLength + replacement.length;

  videoUrlsInput.value = nextValue;
  videoUrlsInput.selectionStart = nextCaret;
  videoUrlsInput.selectionEnd = nextCaret;
  videoUrlsInput.scrollTop = videoUrlsInput.scrollHeight;
  lastVideoUrlsInputValue = nextValue;

  return insertedText;
}

function rememberMobilePasteSnapshot() {
  mobilePasteSnapshotValue = videoUrlsInput.value || '';
  mobilePasteSelectionStart = Number.isFinite(videoUrlsInput.selectionStart)
    ? videoUrlsInput.selectionStart
    : mobilePasteSnapshotValue.length;
  mobilePasteSelectionEnd = Number.isFinite(videoUrlsInput.selectionEnd)
    ? videoUrlsInput.selectionEnd
    : mobilePasteSelectionStart;
  mobilePastePending = true;
  lastVideoUrlsInputValue = mobilePasteSnapshotValue;
}

function getInsertedTextFromRememberedRange(currentValue) {
  const current = String(currentValue || '');
  const previous = String(mobilePasteSnapshotValue || '');
  const start = Math.max(0, Math.min(mobilePasteSelectionStart, current.length));
  const replacedLength = Math.max(0, mobilePasteSelectionEnd - mobilePasteSelectionStart);
  const insertedLength = Math.max(0, current.length - (previous.length - replacedLength));

  return current.slice(start, start + insertedLength);
}

function replaceRememberedPasteRange(currentValue, replacementText) {
  const current = String(currentValue || '');
  const previous = String(mobilePasteSnapshotValue || '');
  const start = Math.max(0, Math.min(mobilePasteSelectionStart, current.length));
  const replacedLength = Math.max(0, mobilePasteSelectionEnd - mobilePasteSelectionStart);
  const insertedLength = Math.max(0, current.length - (previous.length - replacedLength));
  const end = Math.max(start, Math.min(current.length, start + insertedLength));
  const insertedText = current.slice(start, end);
  let replacement = String(replacementText || '');

  if (insertedText.startsWith('\n') && replacement && !replacement.startsWith('\n')) {
    replacement = '\n' + replacement;
  } else if (
    start > 0 &&
    current[start - 1] !== '\n' &&
    replacement &&
    !replacement.startsWith('\n')
  ) {
    replacement = '\n' + replacement;
  }

  const nextValue = current.slice(0, start) + replacement + current.slice(end);
  const nextCaret = start + replacement.length;

  videoUrlsInput.value = nextValue;
  videoUrlsInput.selectionStart = nextCaret;
  videoUrlsInput.selectionEnd = nextCaret;
  videoUrlsInput.scrollTop = videoUrlsInput.scrollHeight;
  lastVideoUrlsInputValue = nextValue;

  return insertedText;
}

function getInsertedText(previousValue, currentValue) {
  const previous = String(previousValue || '');
  const current = String(currentValue || '');
  let prefixLength = 0;

  while (
    prefixLength < previous.length &&
    prefixLength < current.length &&
    previous[prefixLength] === current[prefixLength]
  ) {
    prefixLength++;
  }

  let previousSuffix = previous.length;
  let currentSuffix = current.length;

  while (
    previousSuffix > prefixLength &&
    currentSuffix > prefixLength &&
    previous[previousSuffix - 1] === current[currentSuffix - 1]
  ) {
    previousSuffix--;
    currentSuffix--;
  }

  return current.slice(prefixLength, currentSuffix);
}

function insertVideoUrlsAtCursor(urls) {
  insertTextAtVideoCursor((urls || []).join('\n'));
  lastVideoUrlsInputValue = videoUrlsInput.value || '';
}

function getPasteArtistLabel(parsedPaste) {
  return (parsedPaste?.metadata || [])
    .map(meta => getArtistDisplayName(meta))
    .find(Boolean) || '';
}

function quickScanPaste(text) {
  const source = String(text || '');
  const lines = source.split('\n');
  let count = 0;
  let activeArtist = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    if (!line) continue;

    if (!activeArtist) {
      const compactArtist = compactArtistLineToMeta(line);
      if (compactArtist) {
        activeArtist = compactArtist;
      } else if (line.startsWith('#PONG_ARTIST ')) {
        activeArtist = parsePongJsonLine(line, '#PONG_ARTIST ');
      }
    }

    if (isVideoUrlLine(line)) {
      count++;
    }
  }

  return {
    count,
    artistLabel: getArtistDisplayName(activeArtist)
  };
}

function createPendingPasteEvent(quickInfo) {
  const event = {
    startIndex: parsedVideoUrlsCache.length,
    count: Number(quickInfo?.count || 0),
    pending: true
  };

  pendingPastes.push(event);
  syncPendingPasteCacheState();
  updatePendingPasteButton();

  console.log('[Paste] Queued event ' + pendingPastes.length + ': ~' + event.count + ' URLs');
  return event;
}

function pasteSummaryText(event, quickInfo) {
  const count = Number(quickInfo?.count || event?.count || 0);
  const countText = count
    ? `${count} video${count === 1 ? '' : 's'}`
    : 'bundle';
  const artistText = quickInfo?.artistLabel ? ` from ${quickInfo.artistLabel}` : '';

  return `Cached paste ${pendingPastes.indexOf(event) + 1}: ${countText}${artistText}`;
}

function insertCachedPasteSummaryAtCursor(parsedPaste) {
  const urls = parsedPaste && Array.isArray(parsedPaste.urls) ? parsedPaste.urls : [];
  const artistLabel = getPasteArtistLabel(parsedPaste);
  const countText = `${urls.length} video${urls.length === 1 ? '' : 's'}`;
  const artistText = artistLabel ? ` from ${artistLabel}` : '';
  const summary = `Cached paste ${pendingPastes.length}: ${countText}${artistText}`;

  insertTextAtVideoCursor(summary);
  lastVideoUrlsInputValue = videoUrlsInput.value || '';
}

function schedulePasteParseQueue() {
  if (pasteParseScheduled) return;

  pasteParseScheduled = true;

  setTimeout(() => {
    pasteParseScheduled = false;
    runNextPasteParseJob();
  }, 0);
}

function runNextPasteParseJob() {
  const job = pasteParseQueue.shift();

  if (!job) return;

  const promise = new Promise(resolve => {
    setTimeout(() => {
      try {
        const parsed = parsePastedVideoLines(job.text);
        const urls = Array.isArray(parsed.urls) ? parsed.urls : [];
        const metadata = Array.isArray(parsed.metadata) ? parsed.metadata : [];
        const startIndex = parsedVideoUrlsCache.length;

        if (urls.length) {
          parsedVideoUrlsCache.push(...urls);
          parsedVideoMetadataCache.push(...(metadata.length ? metadata : urls.map(() => ({}))));
        }

        job.event.startIndex = startIndex;
        job.event.count = urls.length;
        job.event.pending = false;
        job.event.ready = true;

        _prevUrlCount = parsedVideoUrlsCache.length;
        parseCacheDirty = false;
        syncPendingPasteCacheState();
        updatePendingPasteButton();
        captureOriginalPasteText(job.text);

        console.log('[Paste Cache] Event ' + (pendingPastes.indexOf(job.event) + 1) + ': +' + urls.length + ' URLs at index ' + startIndex);
      } finally {
        resolve();
      }
    }, 0);
  }).finally(() => {
    pasteParsePromises = pasteParsePromises.filter(item => item !== promise);
    schedulePasteParseQueue();
  });

  pasteParsePromises.push(promise);
}

async function flushPendingPasteParses() {
  while (pasteParseQueue.length || pasteParsePromises.length) {
    const active = pasteParsePromises.slice();

    if (active.length) {
      await Promise.all(active);
    } else {
      await new Promise(resolve => setTimeout(resolve, 0));
    }
  }
}

function queueCapturedPasteText(pastedText) {
  const quickInfo = quickScanPaste(pastedText);
  const event = createPendingPasteEvent(quickInfo);

  insertTextAtVideoCursor(pasteSummaryText(event, quickInfo));

  pasteParseQueue.push({
    text: String(pastedText || ''),
    event
  });
  schedulePasteParseQueue();

  markPasteTextHandled(pastedText);
  finishPasteInputState();

  if (typeof showSortingIndicator === 'function') {
    showSortingIndicator(`Cached paste ${pendingPastes.length}: ${quickInfo.count || 0} videos`);
  }
}

function recordPasteEvent(parsedPaste) {
  recoverDirtyPasteCache();

  const startIndex = parsedVideoUrlsCache.length;
  const urls = parsedPaste && Array.isArray(parsedPaste.urls) ? parsedPaste.urls : [];
  const metadata = parsedPaste && Array.isArray(parsedPaste.metadata) ? parsedPaste.metadata : [];
  const event = { startIndex, count: urls.length };

  if (urls.length) {
    parsedVideoUrlsCache.push(...urls);
    parsedVideoMetadataCache.push(...(metadata.length ? metadata : urls.map(() => ({}))));
  }

  pendingPastes.push(event);
  _prevUrlCount = parsedVideoUrlsCache.length;
  syncPendingPasteCacheState();
  updatePendingPasteButton();

  console.log('[Paste] Event ' + pendingPastes.length + ': +' + event.count + ' URLs at index ' + startIndex);
  return event;
}

function captureOriginalPasteText(text) {
  if (window.PongMetadataSync && typeof window.PongMetadataSync.capturePastedTextAsync === 'function') {
    window.PongMetadataSync.capturePastedTextAsync(text);
  }
}

function markPasteTextHandled(text) {
  lastHandledPasteText = String(text || '');
  lastHandledPasteAt = Date.now();
}

function wasPasteTextJustHandled(text) {
  const pastedText = String(text || '');
  return Date.now() - lastHandledPasteAt < 120 && (!pastedText || pastedText === lastHandledPasteText);
}

function finishPasteInputState() {
  lastVideoUrlsInputValue = videoUrlsInput.value || '';
  mobilePastePending = false;
  mobilePasteSnapshotValue = '';

  setTimeout(() => {
    isHandlingPaste = false;
    ignoreNextPasteInput = false;
  }, 80);
}

function handleCapturedPasteText(pastedText) {
  const quickInfo = quickScanPaste(pastedText);
  const shouldUseFastQueue =
    quickInfo.count > 0 ||
    String(pastedText || '').length > 1000 ||
    String(pastedText || '').includes('#PONG_') ||
    String(pastedText || '').includes('#PA|') ||
    String(pastedText || '').includes('#PV|');

  if (shouldUseFastQueue) {
    queueCapturedPasteText(pastedText);
    return;
  }

  const pastedParsed = parsePastedVideoLines(pastedText);
  const pastedUrls = pastedParsed.urls;
  const pasteEvent = recordPasteEvent(pastedParsed);

  if (pastedUrls.length) {
    // Keep the visible textarea tiny; Load/save/repair use the cached URLs.
    insertCachedPasteSummaryAtCursor(pastedParsed);

    console.log('[Paste Cache] Event ' + pendingPastes.length + ': +' + pastedUrls.length + ' URLs at index ' + pasteEvent.startIndex);

    if (typeof showSortingIndicator === 'function') {
      showSortingIndicator(`Cached paste ${pendingPastes.length}: ${pastedUrls.length} videos`);
    }
  } else {
    insertTextAtVideoCursor(pastedText);
    parseCacheDirty = true;

    if (typeof showSortingIndicator === 'function') {
      showSortingIndicator(`Recorded paste ${pendingPastes.length}`);
    }
  }

  captureOriginalPasteText(pastedText);
  markPasteTextHandled(pastedText);
  finishPasteInputState();
}

function tryReadClipboardPaste() {
  if (!navigator.clipboard || typeof navigator.clipboard.readText !== 'function') return false;

  navigator.clipboard.readText()
    .then(text => {
      if (!text) {
        finishPasteInputState();
        return;
      }

      handleCapturedPasteText(text);
    })
    .catch(error => {
      console.error('[Paste] Clipboard read failed', error);
      showSortingIndicator('Clipboard read blocked');
      finishPasteInputState();
    });

  return true;
}

videoUrlsInput.addEventListener('paste', (e) => {
  const pastedText = e.clipboardData?.getData('text/plain') || '';

  if (pastedText && wasPasteTextJustHandled(pastedText)) {
    e.preventDefault();
    e.stopPropagation();
    return;
  }

  if (!pastedText) {
    if (tryReadClipboardPaste()) {
      e.preventDefault();
      e.stopPropagation();
      isHandlingPaste = true;
      ignoreNextPasteInput = true;
      return;
    }

    rememberMobilePasteSnapshot();
    return;
  }

  // Count every paste immediately. Then handle insertion ourselves so the
  // browser never gets a chance to desync the paperclip counter.
  e.preventDefault();
  e.stopPropagation();

  isHandlingPaste = true;
  ignoreNextPasteInput = true;

  handleCapturedPasteText(pastedText);
}, true);

videoUrlsInput.addEventListener('beforeinput', e => {
  if (e.inputType !== 'insertFromPaste') return;

  rememberMobilePasteSnapshot();

  const pastedText = e.dataTransfer?.getData('text/plain') || e.data || '';

  if (wasPasteTextJustHandled(pastedText)) {
    e.preventDefault();
    return;
  }

  if (!pastedText) {
    if (tryReadClipboardPaste()) {
      e.preventDefault();
      return;
    }
    return;
  }

  e.preventDefault();
  isHandlingPaste = true;
  ignoreNextPasteInput = true;

  handleCapturedPasteText(pastedText);
});

videoUrlsInput.addEventListener('input', e => {
  if (isHandlingPaste || ignoreNextPasteInput) {
    lastVideoUrlsInputValue = videoUrlsInput.value || '';
    return;
  }

  const currentValue = videoUrlsInput.value || '';
  const snapshotValue = mobilePastePending ? mobilePasteSnapshotValue : lastVideoUrlsInputValue;
  const insertedText = mobilePastePending
    ? getInsertedTextFromRememberedRange(currentValue)
    : getInsertedText(snapshotValue, currentValue);
  const quickInserted = quickScanPaste(insertedText);
  const looksLikeMobilePaste =
    e.inputType === 'insertFromPaste' ||
    mobilePastePending ||
    (quickInserted.count > 0 && (insertedText.length > 120 || insertedText.includes('\n') || insertedText.includes('#PONG_') || insertedText.includes('#PA|') || insertedText.includes('#PV|')));

  if (looksLikeMobilePaste) {
    const event = createPendingPasteEvent(quickInserted);

    if (quickInserted.count) {
      if (mobilePastePending) {
        replaceRememberedPasteRange(currentValue, pasteSummaryText(event, quickInserted));
      } else {
        replaceInsertedText(snapshotValue, currentValue, pasteSummaryText(event, quickInserted));
      }
      pasteParseQueue.push({
        text: String(insertedText || ''),
        event
      });
      schedulePasteParseQueue();
      parseCacheDirty = false;

      if (typeof showSortingIndicator === 'function') {
        showSortingIndicator(`Cached paste ${pendingPastes.length}: ${quickInserted.count} videos`);
      }
    } else {
      event.pending = false;
      event.ready = true;
      syncPendingPasteCacheState();
      parseCacheDirty = true;
      lastVideoUrlsInputValue = currentValue;

      if (typeof showSortingIndicator === 'function') {
        showSortingIndicator(`Recorded paste ${pendingPastes.length}`);
      }
    }

    captureOriginalPasteText(insertedText);
    markPasteTextHandled(insertedText);
    mobilePastePending = false;
    mobilePasteSnapshotValue = '';
    updatePendingPasteButton();
    return;
  }

  parseCacheDirty = true;
  if (!String(videoUrlsInput.value || '').trim()) {
    pendingPastes = [];
    _prevUrlCount = 0;
    parsedVideoUrlsCache = [];
    parsedVideoMetadataCache = [];
    syncPendingPasteCacheState();
  }
  lastVideoUrlsInputValue = videoUrlsInput.value || '';
  updatePendingPasteButton();
});

// ─── Session persistence ──────────────────────────────────────────────────────
const SESSION_KEY = 'pong_session_v1';
const UPDATE_PRESERVED_PONG_KEYS = new Set([
  'pong_github_token_v1',
  'pong_coomerfans_proxy_url_v1',
  'pong_random40_openai_key_v1',
  'pong_save_counts_v1',
  'pong_autoplay',
  'pong_repair_item_concurrency_v1',
  'pong_saved_videos_v1',
  'pong_saved_artists_v1'
]);
const UPDATE_TRANSIENT_PONG_KEYS = new Set([
  SESSION_KEY,
  'pong_media_signature_cache_v1',
  'pong_shared_saved_links_cache_v1',
  'pong_saved_videos_playback_cache_v2',
  'pong_saved_artists_playback_cache_v2'
]);

function compactSessionVideoMetadata(meta) {
  if (!meta || typeof meta !== 'object') return {};

  return {
    source: meta.source || '',
    artistName: meta.artistName || '',
    artistKey: meta.artistKey || '',
    artistUrl: meta.artistUrl || '',
    artistDisplayName: meta.artistDisplayName || '',
    postUrl: meta.postUrl || '',
    postIndex: Number(meta.postIndex || 0),
    scrapedAt: meta.scrapedAt || '',
    mediaKey: meta.mediaKey || ''
  };
}

function saveSession() {
  if (window.PongSuppressSessionSaveUntil && Date.now() < window.PongSuppressSessionSaveUntil) return;

  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      allVideoUrls,
      allVideoMetadata: Array.isArray(allVideoMetadata)
        ? allVideoMetadata.map(compactSessionVideoMetadata)
        : [],
      currentBatch,
      currentVideoIndex,
      currentPasteIndex,
      pasteEvents,
      activePlaybackRange,
      currentLoadedRangeStart,
      currentLoadedRangeEnd,
      currentLoadedRangeIsFull,
      currentRenderBatchSize,
      eromeBatchAutoAdvance,
      slidingPlaybackRespectsRange,
      viewedVideoKeys: [...viewedVideoKeys]
    }));
  } catch(e) {}
}

function loadSession() {
  try {
    const rawSession = localStorage.getItem(SESSION_KEY) || '';

    if (rawSession.length > 2500000) {
      localStorage.removeItem(SESSION_KEY);
      return false;
    }

    const s = JSON.parse(rawSession || 'null');
    if (!s || !s.allVideoUrls || !s.allVideoUrls.length) return false;
    allVideoUrls = s.allVideoUrls;
    allVideoMetadata = Array.isArray(s.allVideoMetadata)
      ? s.allVideoMetadata.map(compactSessionVideoMetadata)
      : [];
    currentBatch = s.currentBatch || 0;
    currentVideoIndex = s.currentVideoIndex || 0;
    currentPasteIndex = Number.isInteger(s.currentPasteIndex) ? s.currentPasteIndex : -1;
    pasteEvents = s.pasteEvents || [];
    activePlaybackRange = s.activePlaybackRange || null;
    setCurrentRenderBatchSize(s.currentRenderBatchSize || BATCH_SIZE);
    eromeBatchAutoAdvance = s.eromeBatchAutoAdvance === true;
    slidingPlaybackRespectsRange = s.slidingPlaybackRespectsRange === true;
    window.PongSlidingPlaybackRespectsRange = slidingPlaybackRespectsRange;
    viewedVideoKeys = new Set(Array.isArray(s.viewedVideoKeys) ? s.viewedVideoKeys.map(String) : []);
    setCurrentLoadedRange(
      Number(s.currentLoadedRangeStart || 0),
      Number(s.currentLoadedRangeEnd || 0),
      s.currentLoadedRangeIsFull === true
    );

    if (currentLoadedRangeIsFull && !activePlaybackRange) {
      window.PongLoadAllVideosOnce = true;
    }

    return true;
  } catch(e) { return false; }
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
}

async function clearPongTransientCachesForUpdate() {
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const key = localStorage.key(i);

      if (!key || UPDATE_PRESERVED_PONG_KEYS.has(key)) continue;
      if (UPDATE_TRANSIENT_PONG_KEYS.has(key) || /^pong_(session|pending|parsed|shared|media|repair_log|last_)/.test(key)) {
        localStorage.removeItem(key);
      }
    }
  } catch (_) {}

  try { sessionStorage.clear(); } catch (_) {}

  try {
    if ('caches' in window) {
      const cacheNames = await caches.keys();
      await Promise.all(
        cacheNames
          .filter(name => /pong|odiac|github|localhost|app-cache/i.test(name))
          .map(name => caches.delete(name))
      );
    }
  } catch (_) {}

  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      registrations.forEach(registration => {
        if (registration.update) registration.update();
      });
    }
  } catch (_) {}
}

// ─── Utilities ────────────────────────────────────────────────────────────────
function scheduleSessionSave(delay = 350) {
  if (window.PongSuppressSessionSaveUntil && Date.now() < window.PongSuppressSessionSaveUntil) return;

  const requestedDelay = Number(delay);
  const safeDelay = Number.isFinite(requestedDelay) ? Math.max(0, requestedDelay) : 350;
  const isEromeSession = eromeBatchAutoAdvance || window.PongLoadedSavedMode === 'erome' || window.PongLoadedSavedMode === 'random40';
  const eromeSaveDelay = allVideoUrls.length >= EROME_LARGE_SESSION_URL_THRESHOLD
    ? EROME_LARGE_SESSION_SAVE_MIN_DELAY_MS
    : EROME_SESSION_SAVE_MIN_DELAY_MS;
  const effectiveDelay = isEromeSession
    ? Math.max(safeDelay, eromeSaveDelay)
    : safeDelay;

  clearTimeout(sessionSaveTimer);
  sessionSaveTimer = setTimeout(() => {
    sessionSaveTimer = null;
    if (isEromeSession && typeof requestIdleCallback === 'function') {
      requestIdleCallback(() => saveSession(), { timeout: 5000 });
      return;
    }

    saveSession();
  }, effectiveDelay);
}

function hasActivePlaybackRange() {
  return activePlaybackRange &&
    Number.isInteger(activePlaybackRange.start) &&
    Number.isInteger(activePlaybackRange.end) &&
    activePlaybackRange.end > activePlaybackRange.start;
}

function getActiveRangeTotal() {
  return hasActivePlaybackRange()
    ? Math.max(0, getPlaybackRangeEnd(true) - activePlaybackRange.start)
    : allVideoUrls.length;
}

function getPlaybackRangeEnd(hasRange = hasActivePlaybackRange()) {
  if (!hasRange) return allVideoUrls.length;

  return eromeBatchAutoAdvance && !slidingPlaybackRespectsRange
    ? allVideoUrls.length
    : Math.min(activePlaybackRange.end, allVideoUrls.length);
}

function getCurrentBatchSize() {
  const size = Number(currentRenderBatchSize || BATCH_SIZE);

  return Math.max(1, Number.isFinite(size) ? Math.round(size) : BATCH_SIZE);
}

function setCurrentRenderBatchSize(size) {
  const next = Math.max(1, Number.isFinite(Number(size)) ? Math.round(Number(size)) : BATCH_SIZE);

  currentRenderBatchSize = next;
  window.PongCurrentRenderBatchSize = next;
}

function setEromeTwentyCardMode(enabled, options = {}) {
  eromeBatchAutoAdvance = enabled === true;
  window.PongEromeBatchAutoAdvance = eromeBatchAutoAdvance;
  slidingPlaybackRespectsRange = eromeBatchAutoAdvance && options?.respectRange === true;
  window.PongSlidingPlaybackRespectsRange = slidingPlaybackRespectsRange;

  if (eromeBatchAutoAdvance) {
    setCurrentRenderBatchSize(BATCH_SIZE);
    window.PongLoadAllVideosOnce = false;
  } else {
    slidingPlaybackRespectsRange = false;
    window.PongSlidingPlaybackRespectsRange = false;
  }
}

function setCurrentLoadedRange(start, end, isFull) {
  currentLoadedRangeStart = Math.max(0, Number(start || 0));
  currentLoadedRangeEnd = Math.max(currentLoadedRangeStart, Number(end || currentLoadedRangeStart));
  currentLoadedRangeIsFull = !!isFull;

  window.PongCurrentLoadedRangeStart = currentLoadedRangeStart;
  window.PongCurrentLoadedRangeEnd = currentLoadedRangeEnd;
  window.PongCurrentLoadedRangeIsFull = currentLoadedRangeIsFull;
}

function getCurrentLoadedGlobalVideoIndex() {
  const wrapper = getCurrentVideoWrapper();

  if (!wrapper) return -1;

  const localIndex = parseInt(wrapper.dataset.index || '0', 10);

  if (isNaN(localIndex)) return -1;

  return getVideoGlobalIndexForLocalIndex(localIndex);
}

function getVideoGlobalIndexForLocalIndex(localIndex) {
  const index = Number(localIndex);

  if (!Number.isInteger(index) || index < 0) return -1;

  const metaIndex = Number(videoMetadata[index]?.globalIndex);

  if (Number.isInteger(metaIndex) && metaIndex >= 0) return metaIndex;

  return currentLoadedRangeStart + index;
}

function getVideoMetadataForGlobalIndex(globalIndex) {
  const index = Number(globalIndex);
  const safeIndex = Number.isInteger(index) && index >= 0 ? index : -1;
  const meta = safeIndex >= 0
    ? allVideoMetadata[safeIndex] || {}
    : {};

  return {
    ...meta,
    globalIndex: safeIndex
  };
}

function getEromePlaybackRangeBounds() {
  const rangeStart = hasActivePlaybackRange() ? activePlaybackRange.start : 0;
  const rangeEnd = getPlaybackRangeEnd(hasActivePlaybackRange());

  return {
    start: Math.max(0, rangeStart),
    end: Math.max(rangeStart, rangeEnd)
  };
}

function renderEromeSlidingWindow(activeLocalIndex, removeLocalIndex, direction = 'none') {
  if (!eromeBatchAutoAdvance || !videoUrls.length || !allVideoUrls.length) return false;

  const bounds = getEromePlaybackRangeBounds();
  const batchSize = getCurrentBatchSize();
  const windowSize = Math.min(batchSize, Math.max(0, bounds.end - bounds.start));
  const appendGlobalIndex = Math.max(bounds.start, Number(currentLoadedRangeEnd || 0));
  const removeIndex = Number(removeLocalIndex);
  const activeIndex = Number(activeLocalIndex);

  if (!windowSize || appendGlobalIndex >= bounds.end || eromeSlidingRenderPending) return false;
  if (!Number.isInteger(removeIndex) || removeIndex < 0 || removeIndex >= videoUrls.length) return false;
  if (!Number.isInteger(activeIndex) || activeIndex < 0 || activeIndex >= videoUrls.length) return false;
  if (removeIndex === activeIndex) return false;

  const nextUrl = allVideoUrls[appendGlobalIndex];

  if (!nextUrl) return false;

  const nextUrls = videoUrls.slice();
  const nextMetadata = videoMetadata.slice();
  const restoreIndex = Math.max(
    0,
    Math.min(videoUrls.length - 2, activeIndex - (removeIndex < activeIndex ? 1 : 0))
  );
  const nextLoadedEnd = appendGlobalIndex + 1;
  const logicalStart = Math.max(bounds.start, nextLoadedEnd - windowSize);

  nextUrls.splice(removeIndex, 1);
  nextMetadata.splice(removeIndex, 1);
  nextUrls.push(nextUrl);
  nextMetadata.push(getVideoMetadataForGlobalIndex(appendGlobalIndex));

  videoUrls = nextUrls;
  videoMetadata = nextMetadata;
  setCurrentLoadedRange(logicalStart, nextLoadedEnd, false);

  if (hasActivePlaybackRange()) {
    activePlaybackRange.currentOffset = Math.max(0, logicalStart - bounds.start);
    activePlaybackRange.offset = Math.max(0, nextLoadedEnd - bounds.start);
    currentBatch = Math.max(1, Math.ceil(activePlaybackRange.offset / batchSize));
  } else {
    currentBatch = Math.max(1, Math.ceil(nextLoadedEnd / batchSize));
  }

  eromeSlidingRenderPending = true;
  deckRestoreIndex = restoreIndex;
  videoContainer.innerHTML = '<div class="loading-message">Loading next video...</div>';

  setTimeout(() => {
    try {
      createVideoElements();
      updateNextBatchButton();
      createUnwatchedVideosButton();

      if (DECK_MODE_ENABLED) {
        setDeckActiveIndex(restoreIndex, direction, { pushHistory: false });
      }
    } catch (error) {
      console.warn('[Erome queue] Could not render next card', error);
    } finally {
      eromeSlidingRenderPending = false;
      scheduleSessionSave(500);
    }
  }, 60);

  return true;
}

function recycleNextEromeVideoIntoWrapper(removeLocalIndex) {
  if (!eromeBatchAutoAdvance || !videoUrls.length || !allVideoUrls.length) return false;

  const bounds = getEromePlaybackRangeBounds();
  const batchSize = getCurrentBatchSize();
  const appendGlobalIndex = Math.max(bounds.start, Number(currentLoadedRangeEnd || 0));
  const removeIndex = Number(removeLocalIndex);

  if (appendGlobalIndex >= bounds.end) return false;
  if (!Number.isInteger(removeIndex) || removeIndex < 0 || removeIndex >= videoUrls.length) return false;

  const wrapper = getDeckWrapper(removeIndex);
  const video = wrapper && wrapper.querySelector('video');
  const nextUrl = allVideoUrls[appendGlobalIndex];

  if (!wrapper || !video || !nextUrl) return false;

  const nextLoadedEnd = appendGlobalIndex + 1;
  const windowSize = Math.min(batchSize, Math.max(0, bounds.end - bounds.start));
  const logicalStart = Math.max(bounds.start, nextLoadedEnd - windowSize);
  const nextMetadata = getVideoMetadataForGlobalIndex(appendGlobalIndex);

  videoUrls[removeIndex] = nextUrl;
  videoMetadata[removeIndex] = nextMetadata;
  setCurrentLoadedRange(logicalStart, nextLoadedEnd, false);

  if (hasActivePlaybackRange()) {
    activePlaybackRange.currentOffset = Math.max(0, logicalStart - bounds.start);
    activePlaybackRange.offset = Math.max(0, nextLoadedEnd - bounds.start);
    currentBatch = Math.max(1, Math.ceil(activePlaybackRange.offset / batchSize));
  } else {
    currentBatch = Math.max(1, Math.ceil(nextLoadedEnd / batchSize));
  }

  try {
    video.pause();
    video.removeAttribute('src');
    video.load();
  } catch (_) {}

  delete wrapper.dataset.viewed;
  delete wrapper.dataset.playIntent;
  wrapper.dataset.readyPlayable = 'false';
  wrapper.dataset.autoRetryStartedAt = String(Date.now());
  wrapper.dataset.autoRetryNextAt = String(Date.now() + getVideoRetryDelay(0));
  wrapper.dataset.autoRetryDone = 'false';
  wrapper.dataset.autoRetryCount = '0';
  wrapper.dataset.autoRetryState = 'queued';
  wrapper.classList.remove('video-playing', 'deck-active', 'most-visible');
  wrapper.setAttribute('data-playable', 'false');
  wrapper.style.setProperty('--ready-pct', 0);

  const progressFill = wrapper.querySelector('.video-progress-fill');
  const previewFill = wrapper.querySelector('.preview-fill');
  const timeIndicator = wrapper.querySelector('.time-indicator');
  const durationText = wrapper.querySelector('.video-duration');
  const readyLoader = wrapper.querySelector('.video-ready-loader');
  const percentText = wrapper.querySelector('.video-ready-percent');
  const artistLabel = wrapper.querySelector('.artist-label');

  if (progressFill) progressFill.style.width = '0%';
  if (previewFill) previewFill.remove();
  if (timeIndicator) timeIndicator.style.display = 'none';
  if (durationText) durationText.textContent = '0:00';
  if (readyLoader) {
    readyLoader.style.display = '';
    readyLoader.classList.remove('ready');
  }
  if (percentText) {
    percentText.textContent = '0%';
    percentText.classList.add('not-ready');
  }
  if (artistLabel) {
    const artistName = getArtistDisplayName(nextMetadata);
    artistLabel.dataset.artistName = artistName || '';
    artistLabel.textContent = artistName ? `${artistName}  0/${videoUrls.length}` : `0/${videoUrls.length}`;
    artistLabel.style.display = videoUrls.length ? '' : 'none';
  }

  video.src = nextUrl;
  video.preload = 'metadata';
  video.muted = true;
  video.volume = 0;
  video.dataset.lastLoadKick = '0';
  try {
    video.load();
  } catch (_) {}

  const audioBtn = wrapper.querySelector('.audio-toggle-button');
  if (audioBtn) {
    audioBtn.innerHTML = '🔇';
    audioBtn.setAttribute('data-muted', 'true');
  }

  const spacer = wrapper.nextElementSibling && wrapper.nextElementSibling.classList.contains('blank-space')
    ? wrapper.nextElementSibling
    : null;
  videoContainer.appendChild(wrapper);
  if (spacer) videoContainer.appendChild(spacer);
  moveDeckIndexToBack(removeIndex);
  updateBatchReadyCounter();
  updateViewedRemainingCounter();
  tuneVideoPreloadAround(getDeckWrapper(deckCurrentIndex));
  scheduleSessionSave(500);

  return true;
}

function findEromeRecycleCandidate(excludeIndexes = []) {
  if (!eromeBatchAutoAdvance) return -1;

  const exclude = new Set(
    excludeIndexes
      .map(index => Number(index))
      .filter(index => Number.isInteger(index) && index >= 0)
  );

  const wrappers = getDeckWrappers();

  for (const wrapper of wrappers) {
    const index = getDeckIndex(wrapper);

    if (exclude.has(index)) continue;
    if (isWrapperViewed(wrapper)) return index;
  }

  return -1;
}

function loadNextEromeBatchIfAvailable() {
  const activeWrapper = getCurrentVideoWrapper();
  const activeIndex = getDeckIndex(activeWrapper);
  const removeLocalIndex = findEromeRecycleCandidate([activeIndex]);

  if (recycleNextEromeVideoIntoWrapper(removeLocalIndex)) {
    const nextIndex = getNextDeckIndex();
    if (nextIndex != null) setDeckActiveIndex(nextIndex, 'up', {
      pushHistory: true,
      skipEromeRecycle: true
    });
    return true;
  }

  return false;
}

function getPasteEventIndexForGlobalVideo(globalIndex) {
  if (!Array.isArray(pasteEvents) || !pasteEvents.length || globalIndex < 0) return -1;

  return pasteEvents.findIndex(item => {
    if (!item) return false;

    const start = Number(item.startIndex);
    const count = Number(item.count);

    return globalIndex >= start && globalIndex < start + count;
  });
}

function syncCurrentPasteIndexFromVisibleVideo() {
  const eventIndex = getPasteEventIndexForGlobalVideo(getCurrentLoadedGlobalVideoIndex());

  if (eventIndex >= 0) currentPasteIndex = eventIndex;

  return eventIndex;
}

function getCounterBatchText() {
  if (hasActivePlaybackRange() && Array.isArray(pasteEvents) && pasteEvents.length) {
    const bundleNumber = currentPasteIndex >= 0 ? currentPasteIndex + 1 : 1;

    return `Batch ${bundleNumber}/${pasteEvents.length}`;
  }

  const batchSize = getCurrentBatchSize();

  return `Batch ${Math.max(1, currentBatch)}/${Math.max(1, Math.ceil(allVideoUrls.length / batchSize))}`;
}

function getVideoCounterText(localIndex) {
  const globalIndex = getVideoGlobalIndexForLocalIndex(localIndex);
  const hasRange = hasActivePlaybackRange();
  const rangeStart = hasRange ? activePlaybackRange.start : 0;
  const rangeEnd = hasRange ? getPlaybackRangeEnd(true) : allVideoUrls.length;
  const total = Math.max(0, rangeEnd - rangeStart) || videoUrls.length;
  const position = globalIndex >= rangeStart && globalIndex < rangeEnd
    ? globalIndex - rangeStart + 1
    : Math.max(0, localIndex) + 1;

  return `${Math.max(1, position)}/${Math.max(1, total)} (${getCounterBatchText()})`;
}

function getViewedVideoKeyForGlobalIndex(globalIndex) {
  const index = Number(globalIndex);

  return Number.isInteger(index) && index >= 0 ? String(index) : '';
}

function getCurrentViewedCounterBounds() {
  if (hasActivePlaybackRange()) {
    return {
      start: Math.max(0, Number(activePlaybackRange.start || 0)),
      end: Math.max(0, Math.min(allVideoUrls.length, getPlaybackRangeEnd(true)))
    };
  }

  return {
    start: 0,
    end: allVideoUrls.length || videoUrls.length || 0
  };
}

function getUnviewedVideoCount() {
  const wrappers = Array.from(document.querySelectorAll('.video-wrapper'));

  return wrappers.filter(wrapper => isWrapperReady(wrapper) && !isWrapperViewed(wrapper)).length;
}

function updateViewedRemainingCounter() {
  const btn = document.getElementById('paste-nav-button');

  if (!btn) return;

  const remaining = getUnviewedVideoCount();

  btn.setAttribute('data-unviewed', allVideoUrls.length || videoUrls.length ? String(remaining) : '');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec < 10 ? '0' : ''}${sec}`;
}

// ─── Saved videos / saved artists ────────────────────────────────────────────
const SAVED_VIDEOS_KEY = 'pong_saved_videos_v1';
const SAVED_ARTISTS_KEY = 'pong_saved_artists_v1';

function loadSavedMap(key) {
  try {
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    return data && typeof data === 'object' && !Array.isArray(data) ? data : {};
  } catch(e) {
    return {};
  }
}

function saveSavedMap(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch(e) {}
}

function updateSaveCounters() {
  const savedVideos = loadSavedMap(SAVED_VIDEOS_KEY);
  const savedArtists = loadSavedMap(SAVED_ARTISTS_KEY);

  const videoCount = document.getElementById('saved-video-count');
  const artistCount = document.getElementById('saved-artist-count');

  if (videoCount) videoCount.textContent = Object.keys(savedVideos).length;
  if (artistCount) artistCount.textContent = Object.keys(savedArtists).length;
}

function getVisibleCurrentVideoWrapper() {
  return (
    document.querySelector('.video-wrapper.most-visible') ||
    document.querySelector('.video-wrapper[data-playable="true"]') ||
    document.querySelector(`.video-wrapper[data-index="${currentVideoIndex}"]`)
  );
}

function getCurrentVideoWrapper() {
  const visibleWrapper = getVisibleCurrentVideoWrapper();

  if (visibleWrapper) return visibleWrapper;

  if (window.currentlyPlayingVideo) {
    const playingWrapper = window.currentlyPlayingVideo.closest('.video-wrapper');
    if (playingWrapper) return playingWrapper;
  }

  return null;
}

function getCurrentVideoUrl() {
  const wrapper = getCurrentVideoWrapper();

  if (wrapper) {
    const index = parseInt(wrapper.dataset.index || '0', 10);
    if (!isNaN(index) && videoUrls[index]) return videoUrls[index];

    const video = wrapper.querySelector('video');
    if (video) return video.currentSrc || video.src || null;
  }

  if (window.currentlyPlayingVideo) {
    return window.currentlyPlayingVideo.currentSrc || window.currentlyPlayingVideo.src || null;
  }

  return null;
}

function extractArtistKeyFromUrl(rawUrl) {
  if (!rawUrl) return null;

  let url;
  try {
    url = new URL(rawUrl, window.location.href);
  } catch(e) {
    return null;
  }

  const path = decodeURIComponent(url.pathname || '');

  let match = path.match(/^\/p\/[^/]+\/([^/]+)\/([^/?#]+)/i);
  if (match) {
    return `${match[2].toLowerCase()}:${match[1].toLowerCase()}`;
  }

  match = path.match(/^\/([^/]+)\/user\/([^/]+)(?:\/|$)/i);
  if (match) {
    return `${match[1].toLowerCase()}:${match[2].toLowerCase()}`;
  }

  match = path.match(/\/icons\/([^/]+)\/([^/?#]+)/i);
  if (match) {
    return `${match[1].toLowerCase()}:${match[2].toLowerCase()}`;
  }

  match = path.match(/\/istorage\/([^/.?#]+)/i);
  if (match) {
    return `coomerfans:${match[1].toLowerCase()}`;
  }

  const paramNames = [
    'artist',
    'creator',
    'creator_id',
    'user',
    'username',
    'user_id',
    'model',
    'account'
  ];

  for (const name of paramNames) {
    const value = url.searchParams.get(name);
    if (value) return `${name}:${value.toLowerCase()}`;
  }

  const filename = url.searchParams.get('f') || url.searchParams.get('filename') || '';
  if (filename) {
    const fileMatch = filename.match(/(?:onlyfans|fansly|patreon|coomerfans|fansone|candfans)[_\-\s]+([a-z0-9_.-]+)/i);
    if (fileMatch) return `file:${fileMatch[1].toLowerCase()}`;
  }

  return null;
}

function addSavedVideos(urls, artistKey) {
  const savedVideos = loadSavedMap(SAVED_VIDEOS_KEY);
  let added = 0;

  urls.forEach(url => {
    if (!url) return;

    const key = String(url).trim();
    if (!key) return;

    if (!savedVideos[key]) {
      savedVideos[key] = {
        url: key,
        artistKey: artistKey || extractArtistKeyFromUrl(key) || null,
        savedAt: new Date().toISOString()
      };
      added++;
    }
  });

  saveSavedMap(SAVED_VIDEOS_KEY, savedVideos);
  return added;
}

function saveCurrentVideoLink() {
  const url = getCurrentVideoUrl();

  if (!url) {
    showSortingIndicator('No current video found');
    return;
  }

  const artistKey = extractArtistKeyFromUrl(url);
  const added = addSavedVideos([url], artistKey);

  updateSaveCounters();

  if (added) showSortingIndicator('Saved current video 💾');
  else showSortingIndicator('Video already saved');
}

function saveCurrentArtistVideos() {
  const currentUrl = getCurrentVideoUrl();

  if (!currentUrl) {
    showSortingIndicator('No current video found');
    return;
  }

  const artistKey = extractArtistKeyFromUrl(currentUrl);

  if (!artistKey) {
    showSortingIndicator('Could not detect artist from this URL');
    return;
  }

  const sourceUrls = allVideoUrls && allVideoUrls.length ? allVideoUrls : videoUrls;
  const artistVideos = [...new Set(
    sourceUrls.filter(url => extractArtistKeyFromUrl(url) === artistKey)
  )];

  if (!artistVideos.length) {
    showSortingIndicator('No artist videos found');
    return;
  }

  const savedArtists = loadSavedMap(SAVED_ARTISTS_KEY);
  const existing = savedArtists[artistKey];

  const mergedVideos = existing && Array.isArray(existing.videos)
    ? [...new Set([...existing.videos, ...artistVideos])]
    : artistVideos;

  savedArtists[artistKey] = {
    artistKey,
    videos: mergedVideos,
    savedAt: existing?.savedAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  saveSavedMap(SAVED_ARTISTS_KEY, savedArtists);

  const addedVideoCount = addSavedVideos(artistVideos, artistKey);

  updateSaveCounters();

  if (addedVideoCount > 0) {
    showSortingIndicator(`Saved artist + ${addedVideoCount} videos 👤`);
  } else {
    showSortingIndicator('Artist already saved');
  }
}

function createSaveButtons() {
  if (document.getElementById('save-actions-panel')) {
    updateSaveCounters();
    return;
  }

  const panel = document.createElement('div');
  panel.id = 'save-actions-panel';

// ─── Audio ────────────────────────────────────────────────────────────────────
function setupMobileAudioUnlock() {
  if (window.audioUnlockSetup) return;
  window.audioUnlockSetup = true;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') {
      const resume = () => {
        ctx.resume().then(() => { if (window.currentlyPlayingVideo) unmuteSafely(window.currentlyPlayingVideo); });
        ['touchstart','touchend','click','keydown'].forEach(e => document.removeEventListener(e, resume, true));
      };
      ['touchstart','touchend','click','keydown'].forEach(e => document.addEventListener(e, resume, true));
    }
  } catch(e) {}
}

function unmuteSafely(video) {
  try {
    video.muted = false; video.volume = 1.0;
    if (navigator.userAgent.includes('Firefox')) {
      try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume().catch(() => {}); } catch(e) {}
      setTimeout(() => { if (video.muted) { video.muted = false; video.volume = 0.99; setTimeout(() => { video.volume = 1.0; }, 50); } }, 100);
    }
  } catch(e) {}
}

// ─── Sorting ──────────────────────────────────────────────────────────────────
function sortVideosByDuration() {
  if (!videoMetadata.length) return;
  const w = [], wo = [];
  videoMetadata.forEach((m, i) => { if (m && m.duration > 0) w.push({index:i,duration:m.duration}); else wo.push({index:i}); });
  w.sort((a,b) => b.duration - a.duration);
  reorderAndRedisplayVideos([...w.map(x=>x.index),...wo.map(x=>x.index)]);
  showSortingIndicator('Sorted by duration ⏱️');
}

function sortVideosRandomly() {
  const urls = videoUrlsInput.value.split('\n').filter(u => u.trim());
  if (urls.length <= 1) return;
  for (let i = urls.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [urls[i],urls[j]]=[urls[j],urls[i]]; }
  videoUrlsInput.value = urls.join('\n');
  showSortingIndicator('URLs randomized 🎲');
}

function shuffleInPlace(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }

  return items;
}

function makeIndexRange(start, end) {
  const range = [];

  for (let i = start; i < end; i++) range.push(i);

  return range;
}

function eromeMediaKey(rawUrl) {
  try {
    const url = new URL(rawUrl, window.location.href);
    return `erome:${url.hostname.toLowerCase()}${decodeURIComponent(url.pathname || '')}`;
  } catch (e) {
    return `erome:${String(rawUrl || '').trim()}`;
  }
}

function shuffleLoadedVideosForPlayback(urls, metadata, events) {
  const sourceUrls = (urls || []).slice();
  const sourceMetadata = sourceUrls.map((_, index) => (metadata && metadata[index]) || {});
  const validEvents = (events || [])
    .map(event => ({
      ...event,
      startIndex: Number(event?.startIndex || 0),
      count: Number(event?.count || 0)
    }))
    .filter(event => event.count > 0)
    .sort((a, b) => a.startIndex - b.startIndex);

  const groups = [];
  let cursor = 0;

  validEvents.forEach(event => {
    const startIndex = Math.max(0, Math.min(sourceUrls.length, event.startIndex));
    const endIndex = Math.max(startIndex, Math.min(sourceUrls.length, startIndex + event.count));

    if (startIndex > cursor) groups.push({
      indexes: makeIndexRange(cursor, startIndex),
      event: null
    });
    if (endIndex > startIndex) groups.push({
      indexes: makeIndexRange(startIndex, endIndex),
      event
    });

    cursor = Math.max(cursor, endIndex);
  });

  if (cursor < sourceUrls.length) groups.push({
    indexes: makeIndexRange(cursor, sourceUrls.length),
    event: null
  });
  if (!groups.length) groups.push({
    indexes: makeIndexRange(0, sourceUrls.length),
    event: null
  });

  groups.forEach(group => shuffleInPlace(group.indexes));
  shuffleInPlace(groups);

  const order = groups.flatMap(group => group.indexes);
  let nextStartIndex = 0;
  const pasteEventsForPlayback = validEvents.length
    ? groups.map(group => {
        const event = {
          ...(group.event || {}),
          startIndex: nextStartIndex,
          count: group.indexes.length
        };
        nextStartIndex += group.indexes.length;
        return event;
      })
    : [];

  return {
    urls: order.map(index => sourceUrls[index]),
    metadata: order.map(index => sourceMetadata[index]),
    pasteEvents: pasteEventsForPlayback
  };
}

function reorderAndRedisplayVideos(newOrder) {
  if (window.currentlyPlayingVideo && !window.currentlyPlayingVideo.paused) window.currentlyPlayingVideo.pause();
  videoUrls = newOrder.map(i => videoUrls[i]);
  videoMetadata = newOrder.map(i => videoMetadata[i] || {});
  createVideoElements(); createUnwatchedVideosButton();
  if (!DECK_MODE_ENABLED) videoContainer.scrollTo(0,0);
}

function isEromeScrubContext(options = {}) {
  const meta = options.metadata || {};
  const source = String(meta.source || options.source || '').toLowerCase();
  const candidateUrl = String(
    options.videoUrl ||
    options.url ||
    options.video?.currentSrc ||
    options.video?.src ||
    ''
  );

  return source === 'erome' ||
    /(?:erome\.mp4\?u=|erome\.com|v\d+\.erome\.com)/i.test(candidateUrl);
}

function getAdaptiveScrubTime(startTime, dx, duration, width, options = {}) {
  const safeDuration = Number.isFinite(duration) && duration > 0 ? duration : 0;
  const safeWidth = Math.max(240, width || window.innerWidth || 360);

  if (!safeDuration) return Math.max(0, startTime + dx / 22);

  const dragRatio = dx / safeWidth;
  const secondsPerScreen = isEromeScrubContext(options)
    ? Math.min(Math.max(safeDuration, 90), 900)
    : Math.min(Math.max(safeDuration * 0.18, 24), 210);
  return Math.max(0, Math.min(safeDuration, startTime + dragRatio * secondsPerScreen));
}

function pauseOtherVideos(activeVideo) {
  document.querySelectorAll('.video-player').forEach(v => {
    if (v !== activeVideo && !v.paused) v.pause();

    if (v !== activeVideo) {
      const otherWrapper = v.closest('.video-wrapper');
      if (otherWrapper) otherWrapper.classList.remove('video-playing');
    }
  });
}

function tuneVideoPreloadAround(activeWrapper) {
  const wrappers = Array.from(document.querySelectorAll('.video-wrapper'));
  const activeIndex = wrappers.indexOf(activeWrapper);
  const now = Date.now();

  wrappers.forEach((w, index) => {
    const v = w.querySelector('video');
    if (!v) return;

    const distance = activeIndex < 0 ? Infinity : Math.abs(index - activeIndex);
    const shouldWarm = DECK_MODE_ENABLED
      ? activeIndex < 0
        ? index < DECK_INITIAL_WARM_COUNT
        : distance <= DECK_PRELOAD_RADIUS
      : distance <= 1;
    const desiredPreload = shouldWarm ? 'auto' : 'metadata';
    const lastLoadKick = Number(v.dataset.lastLoadKick || 0);

    if (v.preload !== desiredPreload) v.preload = desiredPreload;
    if (shouldWarm && v.readyState === 0 && now - lastLoadKick > 1400) {
      v.dataset.lastLoadKick = String(now);
      v.load();
    }
  });
}

function prepareVideoForPlayback(video) {
  const wrapper = video && video.closest('.video-wrapper');
  if (!video || !wrapper) return;

  pauseOtherVideos(video);
  tuneVideoPreloadAround(wrapper);
  wrapper.classList.add('video-playing');
  window.currentlyPlayingVideo = video;
}

function playVideoCleanly(video) {
  if (!video) return Promise.resolve();
  if (video.dataset.playRequestPending === 'true') return Promise.resolve();

  video.dataset.playRequestPending = 'true';
  prepareVideoForPlayback(video);

  const playPromise = video.play();

  if (!playPromise || typeof playPromise.catch !== 'function') {
    video.dataset.playRequestPending = 'false';
    return Promise.resolve();
  }

  return playPromise
    .catch(() => {})
    .finally(() => {
      video.dataset.playRequestPending = 'false';
    });
}

window.getAdaptiveScrubTime = getAdaptiveScrubTime;
window.pauseOtherVideos = pauseOtherVideos;
window.tuneVideoPreloadAround = tuneVideoPreloadAround;
window.playVideoCleanly = playVideoCleanly;

function stopVisibleBatchAutoRetry() {
  visibleBatchRetryToken++;

  if (visibleBatchRetryTimer) {
    clearTimeout(visibleBatchRetryTimer);
    visibleBatchRetryTimer = null;
  }
}

function isVideoReadyForInitialPlayback(video) {
  if (!video) return true;

  return video.readyState >= 2;
}

function getVideoReadyPercent(video) {
  if (!video) return 0;
  if (isVideoReadyForInitialPlayback(video)) return 100;

  let percent = 0;

  if (video.readyState >= 1) percent = 35;
  if (video.readyState >= 2) percent = 82;

  try {
    if (Number.isFinite(video.duration) && video.duration > 0 && video.buffered && video.buffered.length) {
      let bufferedEnd = 0;

      for (let i = 0; i < video.buffered.length; i++) {
        bufferedEnd = Math.max(bufferedEnd, video.buffered.end(i));
      }

      percent = Math.max(percent, Math.min(96, (bufferedEnd / video.duration) * 100));
    }
  } catch (_) {}

  return Math.max(0, Math.min(99, percent));
}

function updateBatchReadyCounter() {
  const wrappers = Array.from(document.querySelectorAll('.video-wrapper'));
  const total = wrappers.length || videoUrls.length || 0;
  const ready = wrappers.filter(wrapper => wrapper.dataset.readyPlayable === 'true').length;
  const countText = `${ready}/${total}`;

  wrappers.forEach(wrapper => {
    const label = wrapper.querySelector('.artist-label');
    if (!label) return;

    const index = Number(wrapper.dataset.index || -1);
    const artistName = label.dataset.artistName || getArtistDisplayName(videoMetadata[index]);

    if (artistName && !label.dataset.artistName) {
      label.dataset.artistName = artistName;
    }

    label.textContent = artistName ? `${artistName}  ${countText}` : countText;
    label.style.display = total ? '' : 'none';
  });
}

function updateVideoReadyLoader(video, forceReady = false) {
  const wrapper = video && video.closest('.video-wrapper');

  if (!wrapper) return;

  const loader = wrapper.querySelector('.video-ready-loader');
  const percentText = wrapper.querySelector('.video-ready-percent');
  const wasReady = wrapper.dataset.readyPlayable === 'true';
  const percent = forceReady ? 100 : getVideoReadyPercent(video);
  const rounded = Math.round(percent);

  wrapper.style.setProperty('--ready-pct', rounded);

  if (percentText) {
    percentText.textContent = `${rounded}%`;
    percentText.classList.toggle('not-ready', percent < 100);
  }

  if (percent >= 100) {
    wrapper.dataset.readyPlayable = 'true';

    if (loader) {
      loader.classList.add('ready');
      setTimeout(() => {
        if (loader.classList.contains('ready')) loader.style.display = 'none';
      }, 200);
    }
  } else if (loader) {
    loader.style.display = '';
    loader.classList.remove('ready');
  }

  updateBatchReadyCounter();
  if (wasReady !== (wrapper.dataset.readyPlayable === 'true')) {
    updateViewedRemainingCounter();
  }
  maybePromoteReadyDeckVideo(wrapper);
}

function markVideoAutoRetryDone(video, state) {
  const wrapper = video && video.closest('.video-wrapper');

  if (!wrapper) return;

  wrapper.dataset.autoRetryDone = 'true';
  wrapper.dataset.autoRetryState = state || 'loaded';
  updateVideoReadyLoader(video, true);
}

function getVideoRetryDelay(attempts) {
  return VIDEO_LOAD_RETRY_DELAYS_MS[Math.min(attempts, VIDEO_LOAD_RETRY_DELAYS_MS.length - 1)];
}

function showVideoRefreshPercentPulse(wrapper) {
  const percentText = wrapper && wrapper.querySelector('.video-ready-percent');

  if (!percentText) return;

  percentText.classList.remove('refreshing');
  void percentText.offsetWidth;
  percentText.classList.add('refreshing');
  setTimeout(() => percentText.classList.remove('refreshing'), 950);
}

function retryVisibleBatchVideoLoads(token) {
  if (token !== visibleBatchRetryToken) return;

  const wrappers = Array.from(document.querySelectorAll('.video-wrapper'));
  const activeIndex = wrappers.findIndex(wrapper => wrapper.classList.contains('deck-active'));
  let stillPending = 0;
  let nextDelay = VIDEO_LOAD_RETRY_POLL_MS;
  const now = Date.now();

  wrappers.forEach((wrapper, wrapperIndex) => {
    const distance = activeIndex < 0 ? Infinity : Math.abs(wrapperIndex - activeIndex);
    const shouldRetry = !DECK_MODE_ENABLED
      ? true
      : activeIndex < 0
        ? wrapperIndex < DECK_INITIAL_WARM_COUNT
        : distance <= DECK_PRELOAD_RADIUS;

    if (!shouldRetry) return;

    const video = wrapper.querySelector('video');

    if (!video || wrapper.dataset.autoRetryDone === 'true') return;

    if (isVideoReadyForInitialPlayback(video)) {
      markVideoAutoRetryDone(video, 'loaded');
      return;
    }

    const attempts = Number(wrapper.dataset.autoRetryCount || 0);
    const nextRetryAt = Number(wrapper.dataset.autoRetryNextAt || (now + getVideoRetryDelay(0)));

    stillPending++;

    if (now < nextRetryAt) {
      nextDelay = Math.min(nextDelay, Math.max(250, nextRetryAt - now));
      return;
    }

    wrapper.dataset.autoRetryCount = String(attempts + 1);
    wrapper.dataset.autoRetryNextAt = String(now + getVideoRetryDelay(attempts + 1));
    wrapper.dataset.autoRetryState = 'retrying';
    showVideoRefreshPercentPulse(wrapper);

    try {
      if (video.preload !== 'auto') video.preload = 'auto';
      video.load();
    } catch (error) {
      console.warn('[Video retry] Could not reload video', error);
    }
  });

  if (stillPending > 0 && token === visibleBatchRetryToken) {
    visibleBatchRetryTimer = setTimeout(() => retryVisibleBatchVideoLoads(token), nextDelay);
  } else {
    visibleBatchRetryTimer = null;
  }
}

function startVisibleBatchAutoRetry() {
  stopVisibleBatchAutoRetry();

  const wrappers = Array.from(document.querySelectorAll('.video-wrapper'));

  if (!wrappers.length) return;

  const token = visibleBatchRetryToken;
  const now = Date.now();

  wrappers.forEach(wrapper => {
    wrapper.dataset.autoRetryCount = '0';
    wrapper.dataset.autoRetryStartedAt = String(now);
    wrapper.dataset.autoRetryNextAt = String(now + getVideoRetryDelay(0));
    wrapper.dataset.autoRetryDone = 'false';
  });

  visibleBatchRetryTimer = setTimeout(() => retryVisibleBatchVideoLoads(token), getVideoRetryDelay(0));
}

function warmCurrentBatchVideos() {
  const wrappers = Array.from(document.querySelectorAll('.video-wrapper'));
  const activeIndex = wrappers.findIndex(wrapper => wrapper.classList.contains('deck-active'));
  const videos = wrappers.map(wrapper => wrapper.querySelector('video'));

  videos.forEach((video, index) => {
    if (DECK_MODE_ENABLED) {
      const distance = activeIndex < 0 ? Infinity : Math.abs(index - activeIndex);
      const shouldWarm = activeIndex < 0
        ? index < DECK_INITIAL_WARM_COUNT
        : distance <= DECK_PRELOAD_RADIUS;

      if (!shouldWarm) return;
    }

    setTimeout(() => {
      if (!video || !document.body.contains(video) || isVideoReadyForInitialPlayback(video)) return;

      const lastLoadKick = Number(video.dataset.lastLoadKick || 0);
      const now = Date.now();

      try {
        if (video.preload !== 'auto') video.preload = 'auto';
        if (video.readyState === 0 && now - lastLoadKick > 1600) {
          video.dataset.lastLoadKick = String(now);
          video.load();
        }
      } catch (_) {}

      updateVideoReadyLoader(video);
    }, Math.min(index * 85, 1200));
  });
}

function getDeckWrappers() {
  return Array.from(document.querySelectorAll('.video-wrapper'));
}

function getDeckWrapper(index) {
  return document.querySelector(`.video-wrapper[data-index="${index}"]`);
}

function getDeckIndex(wrapper) {
  const index = Number(wrapper && wrapper.dataset.index);
  return Number.isInteger(index) ? index : -1;
}

function ensureVideoCounter() {
  let counter = document.getElementById('video-counter');

  if (!counter) {
    counter = document.createElement('div');
    counter.id = 'video-counter';
    counter.className = 'video-counter';
    document.body.appendChild(counter);
  }

  return counter;
}

function ensureDeckOrder() {
  const wrappers = getDeckWrappers();
  const valid = new Set(wrappers.map(wrapper => getDeckIndex(wrapper)).filter(index => index >= 0));
  const seen = new Set();

  deckOrder = deckOrder.filter(index => {
    if (!valid.has(index) || seen.has(index)) return false;
    seen.add(index);
    return true;
  });

  wrappers.forEach(wrapper => {
    const index = getDeckIndex(wrapper);
    if (index >= 0 && !seen.has(index)) {
      deckOrder.push(index);
      seen.add(index);
    }
  });
}

function moveDeckIndexToBack(index) {
  ensureDeckOrder();
  deckOrder = deckOrder.filter(item => item !== index);
  deckOrder.push(index);
}

function pushDeckHistoryIndex(stack, index) {
  const safeIndex = Number(index);

  if (!Number.isInteger(safeIndex) || safeIndex < 0) return;

  stack.push(safeIndex);
  if (stack.length > DECK_HISTORY_LIMIT) {
    stack.splice(0, stack.length - DECK_HISTORY_LIMIT);
  }
}

function getNextDeckIndex() {
  ensureDeckOrder();

  const candidates = deckOrder.filter(index => index !== deckCurrentIndex && getDeckWrapper(index));
  const readyUnseen = candidates.find(index => {
    const wrapper = getDeckWrapper(index);
    return isWrapperReady(wrapper) && !isWrapperViewed(wrapper);
  });
  if (readyUnseen != null) return readyUnseen;

  const unreadyUnseen = candidates.find(index => {
    const wrapper = getDeckWrapper(index);
    return !isWrapperReady(wrapper) && !isWrapperViewed(wrapper);
  });
  if (unreadyUnseen != null) return unreadyUnseen;

  return null;
}

function getForwardDeckIndex() {
  while (deckForwardHistory.length) {
    const forwardIndex = deckForwardHistory.pop();
    if (getDeckWrapper(forwardIndex)) return forwardIndex;
  }

  return null;
}

function getPreviousDeckIndex() {
  while (deckHistory.length) {
    const previousIndex = deckHistory.pop();
    if (getDeckWrapper(previousIndex)) return previousIndex;
  }

  return null;
}

function isDeckCurrentBusy() {
  const wrapper = getDeckWrapper(deckCurrentIndex);
  const video = wrapper && wrapper.querySelector('video');

  if (!wrapper) return false;
  if (isWrapperViewed(wrapper)) return true;
  if (wrapper.dataset.playIntent === 'true') return true;
  if (video && !video.paused) return true;

  return false;
}

function clearDeckReadyPromotion() {
  if (deckReadyPromotionTimer) {
    clearTimeout(deckReadyPromotionTimer);
    deckReadyPromotionTimer = null;
  }
}

function lockDeckNavigation(duration = 240) {
  deckNavigationLockedUntil = Math.max(deckNavigationLockedUntil, Date.now() + duration);
}

function isDeckNavigationLocked() {
  return Date.now() < deckNavigationLockedUntil;
}

function showDeckEmptyNotice(message) {
  const now = Date.now();
  if (now - deckLastEmptyNoticeAt < 1200) return;

  deckLastEmptyNoticeAt = now;
  showSortingIndicator(message);
}

function setDeckActiveIndex(index, direction = 'none', options = {}) {
  if (!DECK_MODE_ENABLED) return false;

  const wrappers = getDeckWrappers();
  if (!wrappers.length) return false;

  ensureDeckOrder();

  const numericIndex = Number(index);
  const safeIndex = Number.isInteger(numericIndex)
    ? Math.max(0, Math.min(wrappers.length - 1, numericIndex))
    : 0;
  const target = getDeckWrapper(safeIndex) || wrappers[0];
  const targetIndex = getDeckIndex(target);
  const oldIndex = deckCurrentIndex;
  const oldWrapper = getDeckWrapper(oldIndex);
  const oldWasViewed = isWrapperViewed(oldWrapper);

  if (!target || targetIndex < 0) return false;
  if (oldIndex === targetIndex && target.classList.contains('deck-active')) {
    tuneVideoPreloadAround(target);
    updateBatchReadyCounter();
    updateViewedRemainingCounter();
    return true;
  }

  if (direction !== 'none') lockDeckNavigation(direction === 'ready' ? 280 : 240);

  if (oldWrapper && oldWrapper !== target && options.pushHistory !== false) {
    pushDeckHistoryIndex(deckHistory, oldIndex);
    const oldVideo = oldWrapper.querySelector('video');
    if (oldVideo && !oldVideo.paused) oldVideo.pause();
    oldWrapper.classList.remove('video-playing');
  }

  wrappers.forEach(wrapper => {
    const isActive = wrapper === target;
    wrapper.classList.toggle('deck-active', isActive);
    wrapper.classList.toggle('most-visible', isActive);
    wrapper.setAttribute('data-playable', isActive ? 'true' : 'false');
    wrapper.classList.remove('deck-enter-up', 'deck-enter-down', 'deck-enter-ready');
  });

  const enterClass = direction === 'up'
    ? 'deck-enter-up'
    : direction === 'down'
      ? 'deck-enter-down'
      : direction === 'ready'
        ? 'deck-enter-ready'
        : '';

  if (enterClass) {
    target.classList.add(enterClass);
    setTimeout(() => target.classList.remove(enterClass), 280);
  }

  deckCurrentIndex = targetIndex;
  currentVideoIndex = targetIndex;
  if (eromeBatchAutoAdvance) syncCurrentPasteIndexFromVisibleVideo();
  ensureVideoCounter().textContent = getVideoCounterText(currentVideoIndex);
  tuneVideoPreloadAround(target);
  if (DECK_MODE_ENABLED && !visibleBatchRetryTimer) startVisibleBatchAutoRetry();
  updateBatchReadyCounter();
  updateViewedRemainingCounter();

  if (oldIndex !== targetIndex) scheduleSessionSave(450);

  const video = target.querySelector('video');
  if (window.autoplayEnabled && isWrapperReady(target) && video && video.paused) {
    playVideoCleanly(video);
  }

  if (oldIndex !== targetIndex && oldWasViewed && options.skipEromeRecycle !== true) {
    const recycleIndex = findEromeRecycleCandidate([oldIndex, targetIndex]);

    recycleNextEromeVideoIntoWrapper(recycleIndex);
  }

  return true;
}

function setupDeckMode() {
  if (!DECK_MODE_ENABLED) return false;

  clearDeckReadyPromotion();
  deckNavigationLockedUntil = 0;
  deckAutoPromotionLockedUntil = 0;
  videoContainer.classList.add('deck-mode');
  ensureDeckOrder();

  const wrappers = getDeckWrappers();
  const restoreIndex = Number.isInteger(Number(deckRestoreIndex)) ? Number(deckRestoreIndex) : 0;
  const initialReady = wrappers.find(wrapper => isWrapperReady(wrapper) && !isWrapperViewed(wrapper));
  const initialIndex = initialReady ? getDeckIndex(initialReady) : restoreIndex;

  setDeckActiveIndex(initialIndex, 'none', { pushHistory: false });
  deckRestoreIndex = null;
  return true;
}

function maybePromoteReadyDeckVideo(wrapper) {
  if (!DECK_MODE_ENABLED || !wrapper || !isWrapperReady(wrapper)) return;

  const index = getDeckIndex(wrapper);
  if (index < 0 || index === deckCurrentIndex || isWrapperViewed(wrapper)) return;

  ensureDeckOrder();

  const currentWrapper = getDeckWrapper(deckCurrentIndex);
  const canPromote = !currentWrapper || (!isWrapperReady(currentWrapper) && !isDeckCurrentBusy());

  if (!canPromote || Date.now() < deckAutoPromotionLockedUntil || isDeckNavigationLocked()) return;

  clearDeckReadyPromotion();
  deckReadyPromotionTimer = setTimeout(() => {
    deckReadyPromotionTimer = null;

    const target = getDeckWrapper(index);
    const activeWrapper = getDeckWrapper(deckCurrentIndex);
    const stillCanPromote = !activeWrapper || (!isWrapperReady(activeWrapper) && !isDeckCurrentBusy());

    if (!target || !isWrapperReady(target) || isWrapperViewed(target) || index === deckCurrentIndex) return;
    if (!stillCanPromote || Date.now() < deckAutoPromotionLockedUntil || isDeckNavigationLocked()) return;

    setDeckActiveIndex(index, 'ready', { pushHistory: true });
  }, 220);
}

function goToNextDeckVideo() {
  if (!DECK_MODE_ENABLED) return false;
  if (isDeckNavigationLocked()) return true;

  const currentWrapper = getDeckWrapper(deckCurrentIndex);
  const currentIndex = deckCurrentIndex;
  clearDeckReadyPromotion();
  deckAutoPromotionLockedUntil = Date.now() + 1000;

  const forwardIndex = getForwardDeckIndex();
  if (forwardIndex != null) {
    setDeckActiveIndex(forwardIndex, 'up', {
      pushHistory: true,
      skipEromeRecycle: true
    });
    return true;
  }

  if (currentWrapper && !isWrapperViewed(currentWrapper)) {
    moveDeckIndexToBack(currentIndex);
  }

  const nextIndex = getNextDeckIndex();
  if (nextIndex == null) {
    if (loadNextEromeBatchIfAvailable()) return true;

    showDeckEmptyNotice('No more videos in this batch');
    return true;
  }

  setDeckActiveIndex(nextIndex, 'up', { pushHistory: true });
  return true;
}

function goToPreviousDeckVideo() {
  if (!DECK_MODE_ENABLED) return false;
  if (isDeckNavigationLocked()) return true;
  clearDeckReadyPromotion();
  deckAutoPromotionLockedUntil = Date.now() + 1000;

  const previousIndex = getPreviousDeckIndex();
  if (previousIndex == null) {
    showDeckEmptyNotice('No previous video');
    return true;
  }

  pushDeckHistoryIndex(deckForwardHistory, deckCurrentIndex);
  setDeckActiveIndex(previousIndex, 'down', {
    pushHistory: false,
    skipEromeRecycle: true
  });
  return true;
}

function getDeckSwipePoint(event) {
  if (event.changedTouches && event.changedTouches.length) return event.changedTouches[0];
  if (event.touches && event.touches.length) return event.touches[0];
  return event;
}

function isDeckSwipeBlockedTarget(target) {
  return !!(target && target.closest && target.closest(
    '.video-progress-container, .audio-toggle-button, .control-button, .next-batch-button, .unwatched-videos-button, .paste-nav-button, .save-video-button, .save-artist-button, .repair-button, .controls-overlay, #auth-helper, #erome-helper, button, input, textarea'
  ));
}

function shouldUseDeckSwipe(event) {
  const target = event.target;

  return DECK_MODE_ENABLED &&
    videoContainer &&
    videoContainer.classList.contains('deck-mode') &&
    target &&
    target.closest &&
    target.closest('#video-container') &&
    target.closest('.video-wrapper.deck-active') &&
    !isDeckSwipeBlockedTarget(target);
}

function stopDeckSwipeEvent(event) {
  if (event.cancelable) event.preventDefault();
  event.stopPropagation();
  if (event.stopImmediatePropagation) event.stopImmediatePropagation();
}

function beginDeckSwipe(event, source) {
  if (!shouldUseDeckSwipe(event)) return;
  if (source === 'pointer' && event.pointerType && event.pointerType !== 'touch' && event.pointerType !== 'pen') return;

  const point = getDeckSwipePoint(event);
  deckSwipeGesture = {
    source,
    pointerId: source === 'pointer' ? event.pointerId : null,
    startX: point.clientX,
    startY: point.clientY,
    lastX: point.clientX,
    lastY: point.clientY,
    active: false,
    rejected: false
  };
}

function moveDeckSwipe(event, source) {
  if (!deckSwipeGesture || deckSwipeGesture.source !== source || deckSwipeGesture.rejected) return;
  if (source === 'pointer' && deckSwipeGesture.pointerId !== event.pointerId) return;

  const point = getDeckSwipePoint(event);
  const dx = point.clientX - deckSwipeGesture.startX;
  const dy = point.clientY - deckSwipeGesture.startY;
  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  deckSwipeGesture.lastX = point.clientX;
  deckSwipeGesture.lastY = point.clientY;

  if (!deckSwipeGesture.active) {
    if (absX > 14 && absX > absY * 1.18) {
      deckSwipeGesture.rejected = true;
      return;
    }

    if (absY < 16 || absY < absX * 1.04) return;

    deckSwipeGesture.active = true;
  }

  stopDeckSwipeEvent(event);
}

function endDeckSwipe(event, source) {
  if (!deckSwipeGesture || deckSwipeGesture.source !== source) return;
  if (source === 'pointer' && deckSwipeGesture.pointerId !== event.pointerId) return;

  const point = getDeckSwipePoint(event);
  const dy = (point.clientY || deckSwipeGesture.lastY) - deckSwipeGesture.startY;
  const shouldNavigate = deckSwipeGesture.active && Math.abs(dy) >= 24;
  deckSwipeGesture = null;

  if (!shouldNavigate) return;

  stopDeckSwipeEvent(event);

  const now = Date.now();
  if (now - lastDeckSwipeAt < 180) return;
  lastDeckSwipeAt = now;

  if (dy < 0) goToNextDeckVideo();
  else goToPreviousDeckVideo();
}

function cancelDeckSwipe(event, source) {
  if (!deckSwipeGesture || deckSwipeGesture.source !== source) return;
  if (source === 'pointer' && deckSwipeGesture.pointerId !== event.pointerId) return;
  deckSwipeGesture = null;
}

function setupDeckSwipeController() {
  if (deckSwipeControllerInstalled) return;
  deckSwipeControllerInstalled = true;

  document.addEventListener('touchstart', event => beginDeckSwipe(event, 'touch'), { passive: true, capture: true });
  document.addEventListener('touchmove', event => moveDeckSwipe(event, 'touch'), { passive: false, capture: true });
  document.addEventListener('touchend', event => endDeckSwipe(event, 'touch'), { passive: false, capture: true });
  document.addEventListener('touchcancel', event => cancelDeckSwipe(event, 'touch'), { passive: true, capture: true });

  if (window.PointerEvent) {
    document.addEventListener('pointerdown', event => beginDeckSwipe(event, 'pointer'), { passive: true, capture: true });
    document.addEventListener('pointermove', event => moveDeckSwipe(event, 'pointer'), { passive: false, capture: true });
    document.addEventListener('pointerup', event => endDeckSwipe(event, 'pointer'), { passive: false, capture: true });
    document.addEventListener('pointercancel', event => cancelDeckSwipe(event, 'pointer'), { passive: true, capture: true });
  }
}

// ─── Video elements ───────────────────────────────────────────────────────────

    function scrubTo(clientX) {
