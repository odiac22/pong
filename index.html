  }
}

async function random40RejectCurrentArtistForFutureFinds(bundleInfo = {}) {
  const meta = random40CurrentVideoMeta();
  const artistUrl = random40NormalizeArtistUrl(bundleInfo.artistUrl || meta.artistUrl || meta.postUrl || '');

  if (!artistUrl) {
    showSortingIndicator('No Random 40 artist URL found');
    return false;
  }

  const artistName =
    bundleInfo.artistDisplayName ||
    bundleInfo.bundleLabel ||
    meta.artistDisplayName ||
    meta.artistName ||
    random40ArtistNameFromUrl(artistUrl) ||
    'artist';

  try {
    showSortingIndicator(`Adding ${artistName} as a Random 40 avoid example...`);
    const doc = await random40FetchDoc(artistUrl, { timeoutMs: 22000 });
    const images = random40ExtractReviewImages(doc, artistUrl, meta.imageUrl || '');
    const accepted = random40LoadAcceptedArtists().filter(item => random40NormalizeArtistUrl(item.artistUrl) !== artistUrl);
    const existing = random40LoadRejectedArtists().filter(item => random40NormalizeArtistUrl(item.artistUrl) !== artistUrl);
    random40SaveAcceptedArtists(accepted);
    random40SaveRejectedArtists([
      {
        artistUrl,
        artistName,
        imageUrls: images,
        rejectedAt: new Date().toISOString()
      },
      ...existing
    ]);
    random40State?.seenArtists?.add?.(artistUrl);
    random40State?.rejectedArtistUrls?.add?.(artistUrl);
    showSortingIndicator(`Random 40 will avoid similar artists to ${artistName}`);
    return true;
  } catch (err) {
    const accepted = random40LoadAcceptedArtists().filter(item => random40NormalizeArtistUrl(item.artistUrl) !== artistUrl);
    const existing = random40LoadRejectedArtists().filter(item => random40NormalizeArtistUrl(item.artistUrl) !== artistUrl);
    random40SaveAcceptedArtists(accepted);
    random40SaveRejectedArtists([
      {
        artistUrl,
        artistName,
        imageUrls: [],
        rejectedAt: new Date().toISOString()
      },
      ...existing
    ]);
    random40State?.seenArtists?.add?.(artistUrl);
    random40State?.rejectedArtistUrls?.add?.(artistUrl);
    showSortingIndicator(`Saved ${artistName} as avoid, but images could not load`);
    return true;
  }
}

window.PongRandom40AcceptCurrentArtist = random40AcceptCurrentArtistForFutureFinds;
window.PongRandom40RejectCurrentArtist = random40RejectCurrentArtistForFutureFinds;

function random40FindArtistsOnListing(doc, pageUrl) {
  const found = new Map();
  for (const link of doc.querySelectorAll('a[href*="/u/"]')) {
    const artistUrl = random40NormalizeArtistUrl(link.getAttribute('href'));
    if (!artistUrl || found.has(artistUrl)) continue;
    const card = link.closest('.thumb, article, li, .card, .creator, .model, div') || link.parentElement || link;
    const image = link.querySelector('img') || card?.querySelector('img');
    const imageUrl = random40NormalizeUrl(
      image?.currentSrc || image?.src || image?.getAttribute('data-src') || image?.getAttribute('data-lazy-src') || '',
      pageUrl
    );
    const artistName = String(
      link.getAttribute('title') ||
      link.textContent ||
      image?.getAttribute('alt') ||
      random40ArtistNameFromUrl(artistUrl)
    ).replace(/\s+/g, ' ').trim();
    found.set(artistUrl, {
      artistUrl,
      artistName,
      imageUrl,
      pageText: String(card?.textContent || '').replace(/\s+/g, ' ').trim()
    });
  }
  return [...found.values()];
}

function random40HardFilter(artist) {
  const nameLetters = String(artist.artistName || '').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '');
  if (nameLetters.includes('ts')) return { decision: 'reject', confidence: 1, reason: 'blocked name contains: ts' };
  const combinedText = String(`${artist.artistName || ''} ${artist.pageText || ''} ${artist.artistUrl || ''}`)
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '');
  const blockedFragments = ['transgender', 'transsexual', 'transgirl', 'trans girl', 'tgirl', 't-girl', 'shemale', 'femboy', 'ladyboy', 'crossdresser', 'crossdress', 'mtf'];
  for (const fragment of blockedFragments) {
    if (combinedText.includes(fragment)) return { decision: 'reject', confidence: 1, reason: `blocked text contains: ${fragment}` };
  }
  if (combinedText.includes('trans')) return { decision: 'reject', confidence: 1, reason: 'blocked text contains: trans' };
  const tokens = new Set(combinedText
    .split(/[^a-z0-9]+/g)
    .filter(Boolean));
  for (const word of ['cd', 'trap', 'bbw', 'feet']) {
    if (tokens.has(word)) return { decision: 'reject', confidence: 1, reason: `blocked word: ${word}` };
  }
  return null;
}

async function random40ClassifyArtist(artist, apiKey, imageUrls) {
  const candidateUrls = [...new Set((imageUrls && imageUrls.length ? imageUrls : [artist.imageUrl]).filter(Boolean))].slice(0, RANDOM40_MAX_REVIEW_IMAGES);
  if (!candidateUrls.length) return { decision: 'reject', confidence: 1, reason: 'no image' };
  const acceptedExamples = random40AcceptedExampleContent(artist.artistUrl);
  const rejectedExamples = random40RejectedExampleContent(artist.artistUrl);

  const content = [
    {
      type: 'input_text',
      text:
        `Artist: ${artist.artistName || 'unknown'}\n` +
        `Prompt version: ${RANDOM40_PROMPT_VERSION}\n` +
        `Candidate images included: ${candidateUrls.length}\n\n` +
        `Accepted visual example images included: ${acceptedExamples.filter(item => item.type === 'input_image').length}\n` +
        `Rejected visual example images included: ${rejectedExamples.filter(item => item.type === 'input_image').length}\n\n` +
        'Classify this CoomerFans artist from the candidate profile/post image set. ' +
        'The candidate set should include the listing/profile image plus randomly sampled images from the artist profile whenever available. ' +
        'Grade every candidate image separately, then make one artist-level decision from the full set. ' +
        'Use accepted examples as small positive preference adjustments, not strict look-alike matching. ' +
        'Use red-X rejected examples as stronger hard-negative corrections because they often represent missed hard-filter cases. ' +
        'When hard rejection rules are not triggered, stay broad and favor conventionally attractive adult women with clear, appealing presentation. ' +
        'Do not accept from one favorable thumbnail if the random profile/post images conflict with the hard rules or user preference examples. ' +
        'Reject blank/logo/placeholder/anime/artwork images, images where feet are the main subject, ' +
        'images with any visible male-presenting person, images with no clearly female-presenting adult, ' +
        'images where the person appears underage or age is unclear, and images where the artist appears over 50. Accept only when the profile clearly shows ' +
        'a female-presenting adult and matches at least one preferred style: conventionally attractive styling, fit or athletic presentation, ' +
        'slim/lean presentation, polished appearance, or youthful adult presentation. Do not diagnose, label, or mention body weight or health status. ' +
        'Return unsure only for unclear crops, tiny/blurred images, weak evidence, or genuinely conflicting evidence.'
    }
  ];
  content.push(...acceptedExamples);
  content.push(...rejectedExamples);
  candidateUrls.forEach((url, index) => {
    content.push({ type: 'input_text', text: `Candidate image ${index + 1}:` });
    content.push({ type: 'input_image', image_url: url, detail: 'low' });
  });

  const res = await fetch('https://api.openai.com/v1/responses', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: RANDOM40_MODEL,
      input: [
        {
          role: 'system',
          content: [{
            type: 'input_text',
            text:
              'You are a decisive image triage classifier. Return only the requested structured output. ' +
              'Do not identify the person. Do not infer ethnicity, sexuality, medical conditions, or weight status. ' +
              'Reject any male-presenting person, male-only image, clearly non-photographic image, placeholder, feet-dominant image, non-adult-presenting profile image, or artist who appears over 50. ' +
              'Treat saved accepted examples as small positive nudges. Treat red-X rejected examples as stronger hard-negative corrections after hard rejection rules.'
          }]
        },
        { role: 'user', content }
      ],
      text: {
        format: {
          type: 'json_schema',
          name: 'artist_profile_decision',
          strict: true,
          schema: {
            type: 'object',
            additionalProperties: false,
            properties: {
              decision: { type: 'string', enum: ['accept', 'reject', 'unsure'] },
              confidence: { type: 'number', minimum: 0, maximum: 1 },
              reason: { type: 'string' },
              checks: {
                type: 'object',
                additionalProperties: false,
                properties: {
                  photograph: { type: ['boolean', 'null'] },
                  woman_prominent: { type: ['boolean', 'null'] },
                  male_only: { type: ['boolean', 'null'] },
                  male_present: { type: ['boolean', 'null'] },
                  female_presenting_adult: { type: ['boolean', 'null'] },
                  appears_over_50: { type: ['boolean', 'null'] },
                  feet_dominant: { type: ['boolean', 'null'] },
                  logo_or_placeholder: { type: ['boolean', 'null'] }
                },
                required: ['photograph', 'woman_prominent', 'male_only', 'male_present', 'female_presenting_adult', 'appears_over_50', 'feet_dominant', 'logo_or_placeholder']
              },
              image_grades: {
                type: 'array',
                items: {
                  type: 'object',
                  additionalProperties: false,
                  properties: {
                    image_index: { type: 'integer', minimum: 1 },
                    decision: { type: 'string', enum: ['accept', 'reject', 'unsure'] },
                    confidence: { type: 'number', minimum: 0, maximum: 1 },
                    reason: { type: 'string' },
                    checks: {
                      type: 'object',
                      additionalProperties: false,
                      properties: {
                        male_present: { type: ['boolean', 'null'] },
                        female_presenting_adult: { type: ['boolean', 'null'] },
                        appears_over_50: { type: ['boolean', 'null'] },
                        feet_dominant: { type: ['boolean', 'null'] },
                        logo_or_placeholder: { type: ['boolean', 'null'] },
                        visual_preference_match: { type: ['boolean', 'null'] }
                      },
                      required: ['male_present', 'female_presenting_adult', 'appears_over_50', 'feet_dominant', 'logo_or_placeholder', 'visual_preference_match']
                    }
                  },
                  required: ['image_index', 'decision', 'confidence', 'reason', 'checks']
                }
              }
            },
            required: ['decision', 'confidence', 'reason', 'checks', 'image_grades']
          }
        }
      }
    })
  });

  const raw = await res.text();
  if (!res.ok) throw new Error(`OpenAI HTTP ${res.status}: ${raw.slice(0, 240)}`);
  const payload = JSON.parse(raw);
  const outputText = payload.output_text || payload.output?.flatMap(item => item.content || [])?.find(item => item.type === 'output_text')?.text;
  if (!outputText) throw new Error('OpenAI returned no decision');
  const parsed = JSON.parse(outputText);
  const checks = parsed.checks || {};
  const imageGrades = Array.isArray(parsed.image_grades) ? parsed.image_grades : [];
  const hardRejectedGrade = imageGrades.find(grade => {
    const gradeChecks = grade?.checks || {};
    return gradeChecks.male_present === true ||
      gradeChecks.appears_over_50 === true ||
      gradeChecks.feet_dominant === true;
  });
  if (hardRejectedGrade) {
    return {
      ...parsed,
      decision: 'reject',
      confidence: Math.max(parsed.confidence || 0, hardRejectedGrade.confidence || 0, 0.97),
      reason: `image ${hardRejectedGrade.image_index || '?'} hard reject`
    };
  }
  if (checks.male_present === true || checks.male_only === true) {
    return { ...parsed, decision: 'reject', confidence: Math.max(parsed.confidence || 0, 0.99), reason: 'male-presenting person visible' };
  }
  if (parsed.decision === 'accept' && checks.female_presenting_adult !== true) {
    return { ...parsed, decision: 'reject', confidence: Math.max(parsed.confidence || 0, 0.95), reason: 'no clearly female-presenting adult' };
  }
  if (checks.appears_over_50 === true) {
    return { ...parsed, decision: 'reject', confidence: Math.max(parsed.confidence || 0, 0.96), reason: 'appears over age limit' };
  }
  const visualRejects = imageGrades.filter(grade =>
    grade?.decision === 'reject' &&
    Number(grade.confidence || 0) >= 0.88 &&
    grade?.checks?.visual_preference_match === false
  ).length;
  if (parsed.decision === 'accept' && imageGrades.length >= 2 && visualRejects >= Math.ceil(imageGrades.length / 2)) {
    return { ...parsed, decision: 'reject', confidence: Math.max(parsed.confidence || 0, 0.9), reason: 'random profile images did not match preference' };
  }
  return { ...parsed, reason: String(parsed.reason || '').slice(0, 120) };
}

async function random40ClassifyArtistLocal(artist, endpoint, imageUrls) {
  const candidateUrls = [...new Set((imageUrls && imageUrls.length ? imageUrls : [artist.imageUrl]).filter(Boolean))].slice(0, RANDOM40_MAX_REVIEW_IMAGES);
  if (!candidateUrls.length) return { decision: 'reject', confidence: 1, reason: 'no image' };

  const res = await fetch(`${endpoint}/classify`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      app: 'pong-random40',
      model: RANDOM40_LOCAL_MODEL_NAME,
      promptVersion: RANDOM40_PROMPT_VERSION,
      artist: {
        artistUrl: artist.artistUrl,
        artistName: artist.artistName || random40ArtistNameFromUrl(artist.artistUrl),
        pageText: artist.pageText || '',
        imageUrl: artist.imageUrl || ''
      },
      candidateImageUrls: candidateUrls,
      acceptedArtists: random40LoadAcceptedArtists(),
      rejectedArtists: random40LoadRejectedArtists()
    })
  });

  const text = await res.text();
  if (!res.ok) throw new Error(`Local AI HTTP ${res.status}: ${text.slice(0, 180)}`);
  const parsed = JSON.parse(text);
  const checks = parsed.checks || {};
  if (checks.male_present === true || checks.male_only === true) {
    return { ...parsed, decision: 'reject', confidence: Math.max(parsed.confidence || 0, 0.99), reason: 'male-presenting person visible' };
  }
  if (parsed.decision === 'accept' && checks.female_presenting_adult === false) {
    return { ...parsed, decision: 'reject', confidence: Math.max(parsed.confidence || 0, 0.9), reason: 'local visual preference mismatch' };
  }
  if (checks.appears_over_50 === true) {
    return { ...parsed, decision: 'reject', confidence: Math.max(parsed.confidence || 0, 0.96), reason: 'appears over age limit' };
  }
  return { ...parsed, reason: String(parsed.reason || '').slice(0, 120) };
}

function random40ExtractReviewImages(doc, baseUrl, firstImage) {
  const urls = [];
  const add = raw => {
    const url = random40NormalizeUrl(raw, baseUrl);
    if (!url || urls.includes(url)) return;
    if (!/\.(?:avif|gif|jpe?g|png|webp)(?:\?|$)/i.test(url) && !/\/(?:i?storage|data)\//i.test(url)) return;
    urls.push(url);
  };
  add(firstImage);
  doc.querySelectorAll('meta[property="og:image"], meta[name="twitter:image"]').forEach(node => add(node.getAttribute('content')));
  doc.querySelectorAll('main img, article img, .post img, div.post img, img').forEach(node => {
    const context = `${node.getAttribute('alt') || ''} ${node.className || ''}`.toLowerCase();
    if (/\b(logo|favicon|sprite|icon|banner|placeholder|advert|ads?)\b/i.test(context)) return;
    add(node.currentSrc || node.src || node.getAttribute('src') || node.getAttribute('data-src') || node.getAttribute('data-lazy-src'));
  });
  return urls;
}

function random40ShuffleUrls(urls) {
  const shuffled = [...urls];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function random40SelectCandidateImages(imageUrls, firstImage, randomExtraCount, maxImages) {
  const normalizedFirst = random40NormalizeUrl(firstImage, location.href);
  const unique = [...new Set((imageUrls || []).filter(Boolean))];
  const primary = normalizedFirst || unique[0] || '';
  const extras = unique.filter(url => url && url !== primary);
  const selectedExtras = random40ShuffleUrls(extras).slice(0, Math.max(0, randomExtraCount));
  return [primary, ...selectedExtras].filter(Boolean).slice(0, maxImages);
}

function random40PageUrl(page) {
  return `https://coomerfans.com/${page > 1 ? `?page=${page}` : ''}`;
}

function random40RandomPage() {
  return RANDOM40_PAGE_MIN + Math.floor(Math.random() * (RANDOM40_PAGE_MAX - RANDOM40_PAGE_MIN + 1));
}

function random40ExtractVideoPostLinks(doc, baseUrl) {
  const links = [];
  doc.querySelectorAll('div.post').forEach(post => {
    if (post.querySelector('img')) return;
    const link = post.querySelector('a.view-post, a[href*="/p/"], a[href*="/post/"]');
    const href = link?.getAttribute('href') || '';
    if (href) links.push(random40NormalizeUrl(href, baseUrl));
  });
  return [...new Set(links.filter(Boolean))];
}

async function random40CollectVideoPostLinks(artist, { stopAt = Infinity, maxPages = RANDOM40_MAX_ARTIST_PAGES } = {}) {
  const base = artist.artistUrl;
  const postLinks = new Set();
  const firstDoc = await random40FetchDoc(base, { timeoutMs: 22000 });

  random40ExtractVideoPostLinks(firstDoc, base).forEach(url => postLinks.add(url));

  let page = 2;
  while (page <= maxPages && postLinks.size < stopAt) {
    if (random40State?.stop) break;
    const pages = Array.from({ length: RANDOM40_PAGE_BATCH_SIZE }, (_, i) => page + i);
    const docs = await Promise.all(pages.map(n =>
      random40FetchDoc(`${base}?page=${n}`, { timeoutMs: 16000 }).catch(() => null)
    ));
    let hasPosts = false;
    docs.forEach((doc, index) => {
      if (!doc) return;
      if (doc.querySelector('div.post')) hasPosts = true;
      random40ExtractVideoPostLinks(doc, `${base}?page=${pages[index]}`).forEach(url => postLinks.add(url));
    });
    if (!hasPosts) break;
    page += RANDOM40_PAGE_BATCH_SIZE;
  }

  return {
    firstDoc,
    links: [...postLinks]
  };
}

async function random40VideoEntriesFromPost(postUrl, artistInfo) {
  const doc = await random40FetchDoc(postUrl, { timeoutMs: 22000 });
  const body = doc.querySelector('div.post-body') || doc.body;
  const urls = [];
  body.querySelectorAll('video source[src], video[src], a[href]').forEach(node => {
    const raw = node.getAttribute('src') || node.getAttribute('href');
    if (raw && /\.(mp4|m4v|mov|webm)(\?|$)/i.test(raw)) {
      urls.push(random40NormalizeUrl(raw, postUrl));
    }
  });
  return [...new Set(urls.filter(Boolean))].map((videoUrl, postIndex) => ({
    ...artistInfo,
    type: 'video',
    videoUrl,
    mediaKey: extractArtistKeyFromUrl(videoUrl) || videoUrl,
    postUrl,
    postIndex
  }));
}

async function random40ScrapeArtistVideos(artist) {
  const base = artist.artistUrl;
  const collected = await random40CollectVideoPostLinks(artist);
  const artistInfo = random40ArtistInfo(base, collected.firstDoc);
  const links = collected.links;
  return random40Pool(links, RANDOM40_POST_CONCURRENCY, postUrl =>
    random40VideoEntriesFromPost(postUrl, artistInfo).catch(() => [])
  ).then(results => results.flat());
}

function random40BuildImportPayload(entries, globalStartIndex = 0) {
  const byArtist = new Map();
  entries.filter(entry => entry?.videoUrl).forEach(entry => {
    const key = entry.artistKey || entry.artistUrl;
    if (!byArtist.has(key)) byArtist.set(key, []);
    byArtist.get(key).push(entry);
  });

  const urls = [];
  const metadata = [];
  const events = [];

  for (const artistEntries of byArtist.values()) {
    const first = artistEntries[0];
    const start = urls.length;
    artistEntries.forEach(entry => {
      urls.push(entry.videoUrl);
      metadata.push({
        ...entry,
        source: 'random40',
        artistDisplayName: entry.artistDisplayName || entry.artistName || random40ArtistNameFromUrl(entry.artistUrl)
      });
    });
    events.push({
      startIndex: Number(globalStartIndex || 0) + start,
      count: urls.length - start,
      artistKey: first.artistKey || first.artistUrl,
      bundleKey: `random40:${first.artistKey || first.artistUrl}`,
      source: 'random40',
      artistUrl: first.artistUrl,
      postUrl: first.artistUrl,
      artistDisplayName: first.artistDisplayName || first.artistName || '',
      bundleLabel: first.artistDisplayName || first.artistName || '',
      loadAll: false,
      ready: true,
      pending: false
    });
  }

  return { urls, metadata, events };
}

function random40PublishEntries(entries) {
  const payload = random40BuildImportPayload(entries, allVideoUrls.length);
  if (!payload.urls.length) return payload;

  if (!random40State.cardsStarted) {
    parsedVideoUrlsCache = payload.urls;
    parsedVideoMetadataCache = payload.metadata;
    pendingPastes = payload.events.map(event => ({ ...event, startIndex: event.startIndex - allVideoUrls.length }));
    _prevUrlCount = payload.urls.length;
    parseCacheDirty = false;
    syncPendingPasteCacheState();
    updatePendingPasteButton();
    if (videoUrlsInput) videoUrlsInput.value = `Cached Random 40: ${payload.urls.length} videos`;
    setEromeTwentyCardMode(true);
    window.PongEromeAutoAdvanceOnce = true;
    window.PongLoadAllVideosOnce = false;
    loadVideosButton.click();
    window.PongLoadedSavedMode = 'random40';
    random40State.cardsStarted = true;
    showSortingIndicator(`Loaded first ${payload.urls.length} Random 40 videos. Continuing in background...`);
  } else {
    allVideoUrls.push(...payload.urls);
    allVideoMetadata.push(...payload.metadata);
    pasteEvents.push(...payload.events);
    window.PongLoadedSavedMode = 'random40';
    updatePasteNavigationButton();
    updateViewedRemainingCounter();
    scheduleSessionSave(700);
  }

  random40State.videos += payload.urls.length;
  return payload;
}

async function random40Pool(items, limit, worker) {
  const results = new Array(items.length);
  let index = 0;
  async function run() {
    while (index < items.length && !random40State?.stop) {
      const current = index++;
      results[current] = await worker(items[current], current);
    }
  }
  await Promise.all(Array.from({ length: Math.min(Math.max(1, limit), items.length || 1) }, run));
  return results;
}

async function random40AnalyzeArtist(artist, apiKey, options = {}) {
  let doc = options.firstDoc || null;
  const workingArtist = { ...artist };
  const mode = options.mode === 'local' ? 'local' : 'nano';

  if (!doc) {
    try {
      doc = await random40FetchDoc(artist.artistUrl, { timeoutMs: 18000 });
    } catch (_) {}
  }

  if (doc?.body) {
    workingArtist.pageText = `${artist.pageText || ''} ${doc.body.innerText || ''}`.replace(/\s+/g, ' ').trim();
  }

  const hard = random40HardFilter(workingArtist);
  if (hard) return hard;

  const initialImages = doc
    ? random40SelectCandidateImages(
        random40ExtractReviewImages(doc, workingArtist.artistUrl, workingArtist.imageUrl),
        workingArtist.imageUrl,
        RANDOM40_RANDOM_PROFILE_IMAGES_PER_ARTIST,
        RANDOM40_INITIAL_IMAGES_PER_ARTIST
      )
    : [workingArtist.imageUrl].filter(Boolean);

  let decision = mode === 'local'
    ? await random40ClassifyArtistLocal(workingArtist, options.localEndpoint, initialImages)
    : await random40ClassifyArtist(workingArtist, apiKey, initialImages);
  random40State.api++;
  if (Number(decision.confidence || 0) < RANDOM40_CONFIDENCE_REVIEW) {
    try {
      if (!doc) doc = await random40FetchDoc(workingArtist.artistUrl, { timeoutMs: 18000 });
      const images = random40SelectCandidateImages(
        random40ExtractReviewImages(doc, workingArtist.artistUrl, workingArtist.imageUrl),
        workingArtist.imageUrl,
        RANDOM40_MAX_REVIEW_IMAGES - 1,
        RANDOM40_MAX_REVIEW_IMAGES
      );
      const changedImages = images.length !== initialImages.length || images.some((url, index) => url !== initialImages[index]);
      if (images.length > initialImages.length || changedImages) {
        decision = mode === 'local'
          ? await random40ClassifyArtistLocal(workingArtist, options.localEndpoint, images)
          : await random40ClassifyArtist(workingArtist, apiKey, images);
        random40State.api++;
        decision.reason = `reviewed ${images.length} images: ${decision.reason || ''}`.slice(0, 120);
      }
    } catch (_) {}
  }
  return decision;
}

async function startRandom40(mode = 'nano') {
  if (random40State && !random40State.done) {
    random40State.stop = true;
    updateRandom40Progress({ detail: 'Stopping after current work...', force: true });
    return;
  }

  const runMode = mode === 'local' ? 'local' : 'nano';
  const apiKey = runMode === 'nano' ? getRandom40ApiKey() : '';
  const localEndpoint = runMode === 'local' ? await getRandom40LocalEndpoint() : '';
  if (runMode === 'nano' && !apiKey) return;
  if (runMode === 'local' && !localEndpoint) return;

  random40State = {
    mode: runMode,
    localEndpoint,
    accepted: 0,
    videos: 0,
    pages: 0,
    api: 0,
    skippedLowVideo: 0,
    cardsStarted: false,
    stop: false,
    done: false,
    seenPages: new Set(),
    seenArtists: new Set(),
    rejectedArtistUrls: new Set(random40LoadRejectedArtists().map(item => random40NormalizeArtistUrl(item.artistUrl)).filter(Boolean))
  };

  updateRandom40Progress({ detail: `Starting ${runMode === 'local' ? 'local' : 'nano'} random scan...`, force: true });

  try {
    while (!random40State.stop && random40State.accepted < RANDOM40_TARGET_ACCEPTED) {
      const pages = [];
      let attempts = 0;

      while (pages.length < RANDOM40_LISTING_PAGE_BATCH_SIZE && attempts < RANDOM40_LISTING_PAGE_BATCH_SIZE * 8) {
        const page = random40RandomPage();
        attempts++;
        if (random40State.seenPages.has(page)) continue;
        random40State.seenPages.add(page);
        pages.push(page);
      }

      if (!pages.length) continue;

      updateRandom40Progress({ detail: `Loading pages ${pages.join(', ')}`, accepted: random40State.accepted, videos: random40State.videos, pages: random40State.pages, api: random40State.api, force: true });

      let artists = [];
      try {
        const pageResults = await Promise.all(pages.map(page => {
          const pageUrl = random40PageUrl(page);
          return random40FetchDoc(pageUrl, { timeoutMs: 22000 })
            .then(doc => ({ page, pageUrl, doc }))
            .catch(error => ({ page, pageUrl, error }));
        }));
        const byArtist = new Map();

        pageResults.forEach(result => {
          random40State.pages++;
          if (result.error || !result.doc) return;
          random40FindArtistsOnListing(result.doc, result.pageUrl).forEach(artist => {
            if (!artist.imageUrl) return;
            if (random40State.seenArtists.has(artist.artistUrl)) return;
            if (random40State.rejectedArtistUrls.has(artist.artistUrl)) return;
            byArtist.set(artist.artistUrl, artist);
          });
        });

        artists = shuffleInPlace([...byArtist.values()]);
      } catch (err) {
        random40State.pages += pages.length;
        updateRandom40Progress({ detail: `Page batch failed: ${err.message}`, accepted: random40State.accepted, videos: random40State.videos, pages: random40State.pages, api: random40State.api, force: true });
        continue;
      }

      if (!artists.length) {
        updateRandom40Progress({ detail: `No usable artists on ${pages.length} pages`, accepted: random40State.accepted, videos: random40State.videos, pages: random40State.pages, api: random40State.api });
        continue;
      }

      const classifierConcurrency = runMode === 'local' ? RANDOM40_LOCAL_CONCURRENCY : RANDOM40_AI_CONCURRENCY;
      await random40Pool(artists, classifierConcurrency, async artist => {
        if (random40State.stop || random40State.accepted >= RANDOM40_TARGET_ACCEPTED) return;
        random40State.seenArtists.add(artist.artistUrl);
        updateRandom40Progress({ detail: `Checking videos: ${artist.artistName || random40ArtistNameFromUrl(artist.artistUrl)}`, accepted: random40State.accepted, videos: random40State.videos, pages: random40State.pages, api: random40State.api });
        const precheck = await random40CollectVideoPostLinks(artist, { stopAt: RANDOM40_MIN_VIDEOS_PER_ARTIST }).catch(() => ({ links: [] }));
        if ((precheck.links || []).length < RANDOM40_MIN_VIDEOS_PER_ARTIST) {
          random40State.skippedLowVideo = (random40State.skippedLowVideo || 0) + 1;
          updateRandom40Progress({
            detail: `Skipped ${artist.artistName || 'artist'}: ${precheck.links?.length || 0}/${RANDOM40_MIN_VIDEOS_PER_ARTIST} video posts`,
            accepted: random40State.accepted,
            videos: random40State.videos,
            pages: random40State.pages,
            api: random40State.api
          });
          return;
        }
        const classifierLabel = runMode === 'local' ? 'Local' : 'Nano';
        updateRandom40Progress({ detail: `${classifierLabel} ${artist.artistName || random40ArtistNameFromUrl(artist.artistUrl)} - ${precheck.links.length}+ videos, 4 images`, accepted: random40State.accepted, videos: random40State.videos, pages: random40State.pages, api: random40State.api });
        const decision = await random40AnalyzeArtist(artist, apiKey, { firstDoc: precheck.firstDoc, mode: runMode, localEndpoint }).catch(err => ({ decision: 'reject', confidence: 0, reason: err.message }));
        if (decision.decision !== 'accept') return;
        if (random40State.accepted >= RANDOM40_TARGET_ACCEPTED) return;
        updateRandom40Progress({ detail: `${classifierLabel} accepted ${artist.artistName}. Scraping videos...`, accepted: random40State.accepted, videos: random40State.videos, pages: random40State.pages, api: random40State.api, force: true });
        const entries = await random40ScrapeArtistVideos(artist).catch(() => []);
        if (entries.length < RANDOM40_MIN_VIDEOS_PER_ARTIST) {
          random40State.skippedLowVideo = (random40State.skippedLowVideo || 0) + 1;
          updateRandom40Progress({
            detail: `Skipped accepted ${artist.artistName}: only ${entries.length}/${RANDOM40_MIN_VIDEOS_PER_ARTIST} videos`,
            accepted: random40State.accepted,
            videos: random40State.videos,
            pages: random40State.pages,
            api: random40State.api,
            force: true
          });
          return;
        }
        if (random40State.accepted >= RANDOM40_TARGET_ACCEPTED) return;
        random40State.accepted++;
        random40PublishEntries(entries);
        updateRandom40Progress({ detail: `${random40State.accepted}/${RANDOM40_TARGET_ACCEPTED} accepted - ${random40State.videos} videos`, accepted: random40State.accepted, videos: random40State.videos, pages: random40State.pages, api: random40State.api, force: true });
      });
    }

    random40State.done = true;
    updateRandom40Progress({
      detail: random40State.stop
        ? `Stopped: ${random40State.accepted} accepted, ${random40State.videos} videos, ${random40State.skippedLowVideo || 0} low-video skipped`
        : `Done: ${random40State.accepted} accepted, ${random40State.videos} videos, ${random40State.skippedLowVideo || 0} low-video skipped`,
      accepted: random40State.accepted,
      videos: random40State.videos,
      pages: random40State.pages,
      api: random40State.api,
      force: true
    });
    hideRandom40Progress(2500);
  } catch (err) {
    random40State.done = true;
    updateRandom40Progress({ detail: `Random 40 failed: ${err.message}`, force: true });
  }
}

const EROME_ALBUM_SCRAPE_CONCURRENCY = 8;
const EROME_INITIAL_ALBUM_BATCH_SIZE = 4;
const EROME_READY_ALBUM_BUFFER_TARGET = 5;
const EROME_BACKGROUND_ALBUM_CONCURRENCY = 2;
const EROME_BACKGROUND_LOW_BUFFER_DELAY_MS = 650;
const EROME_BACKGROUND_PLAYING_LOW_BUFFER_DELAY_MS = 1100;
const EROME_BACKGROUND_READY_BUFFER_DELAY_MS = 3600;
const EROME_PROFILE_PAGE_CONCURRENCY = 4;
const EROME_BACKGROUND_PROFILE_CONCURRENCY = 1;
const EROME_FETCH_TIMEOUT_MS = 8000;
const EROME_FINAL_RETRY_TIMEOUT_MS = 16000;

async function fetchEromeJson(proxyBase, endpoint, targetUrl, options = {}) {
  const maxAttempts = Math.max(1, Number(options.attempts || 2));
  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const controller = typeof AbortController !== 'undefined'
      ? new AbortController()
      : null;
    const timeoutId = controller
      ? setTimeout(() => controller.abort(), Number(options.timeoutMs || EROME_FETCH_TIMEOUT_MS))
      : null;

    try {
      const requestUrl = new URL(proxyBase + endpoint);

      requestUrl.searchParams.set('u', targetUrl);
      if (options.fast) requestUrl.searchParams.set('fast', '1');

      const res = await fetch(requestUrl.toString(), {
        signal: controller ? controller.signal : undefined
      });
      if (!res.ok) throw new Error('scrape HTTP ' + res.status);

      return await res.json();
    } catch (err) {
      lastError = err;

      if (attempt < maxAttempts) {
        await sleep(450 * attempt);
        continue;
      }
    } finally {
      if (timeoutId) clearTimeout(timeoutId);
    }
  }

  throw lastError || new Error('Erome scrape failed');
}

async function fetchEromeScrapeData(proxyBase, targetUrl, options = {}) {
  return fetchEromeJson(proxyBase, '/scrape', targetUrl, options);
}

async function fetchEromeAlbumListData(proxyBase, targetUrl, options = {}) {
  return fetchEromeJson(proxyBase, '/albums', targetUrl, options);
}

async function eromePool(items, limit, task) {
  const results = new Array(items.length);
  let index = 0;

  async function worker() {
    while (index < items.length) {
      const currentIndex = index++;

      try {
        results[currentIndex] = await task(items[currentIndex], currentIndex);
      } catch (err) {
        console.warn('Erome album task failed:', items[currentIndex], err);
        results[currentIndex] = null;
      }
    }
  }

  await Promise.all(
    Array.from({ length: Math.min(Math.max(1, limit), items.length) }, worker)
  );

  return results;
}

async function eromeRetryOnce(items, limit, task, onRetryStart) {
  const pending = (items || []).slice();
  const failed = [];

  if (!pending.length) return failed;

  if (typeof onRetryStart === 'function') {
    onRetryStart(pending);
  }

  await eromePool(pending, limit, async item => {
    const ok = await task(item);

    if (!ok) failed.push(item);
  });

  return failed;
}

function getEromeReadyAlbumBufferCount() {
  if (!eromeBatchAutoAdvance || !Array.isArray(pasteEvents) || !pasteEvents.length) return 0;

  const syncedIndex = syncCurrentPasteIndexFromVisibleVideo();
  const activeIndex = syncedIndex >= 0
    ? syncedIndex
    : Math.max(0, Number(currentPasteIndex || 0));

  return Math.max(0, pasteEvents.length - activeIndex - 1);
}

async function waitForEromeBackgroundScrapeSlot() {
  const readyAlbums = getEromeReadyAlbumBufferCount();
  const needsBuffer = readyAlbums < EROME_READY_ALBUM_BUFFER_TARGET;
  const activeVideo = window.currentlyPlayingVideo;
  const isPlaying = !!(activeVideo && !activeVideo.paused && !activeVideo.ended);
  const delay = needsBuffer
    ? isPlaying
      ? EROME_BACKGROUND_PLAYING_LOW_BUFFER_DELAY_MS
      : EROME_BACKGROUND_LOW_BUFFER_DELAY_MS
    : EROME_BACKGROUND_READY_BUFFER_DELAY_MS;

  await sleep(delay);

  if (!needsBuffer && isPlaying) {
    await sleep(EROME_BACKGROUND_READY_BUFFER_DELAY_MS);
  }
}

async function loadEromeAsCards() {
  window.PongActiveSavedEromeRefreshUrl = '';

  const targets = getEromeScrapeTargets();

  if (!targets.length) {
    alert('Paste one or more Erome artist or album URLs first.');
    return;
  }

  if (!EROME_PROXY_BASE) {
    alert('Pong cards for Erome need the proxy Worker.\n\n'
      + '1. Deploy workers/erome-proxy.js (wrangler deploy)\n'
      + '2. Set EROME_PROXY_BASE in index.html to your worker URL\n\n'
      + 'Until then, use "Open" to watch Erome inside the app.');
    return;
  }

  const base = EROME_PROXY_BASE.replace(/\/+$/, '');
  const allGroups = [];
  const failures = [];
  const firstPageRetryQueue = [];
  const discoveryRetryQueue = [];
  const completedDiscoveryPageKeys = new Set();
  const albumQueue = [];
  const seenAlbumUrls = new Set();
  const seenGroupUrls = new Set();
  const seenVideoUrls = new Set();
  let completedPages = 0;
  let totalPages = targets.length;
  let completedAlbums = 0;
  let totalVideos = 0;
  let eromeCardsStarted = false;
  let importedGroupCount = 0;

  function addAlbumToQueue(rawAlbum, sourceUrl, sourceTitle) {
    const rawUrl = typeof rawAlbum === 'string' ? rawAlbum : rawAlbum?.url;
    const albumUrl = normalizeEromeLaunchUrl(rawUrl);

    if (!albumUrl || !isEromeAlbumLaunchUrl(albumUrl) || seenAlbumUrls.has(albumUrl)) return;

    seenAlbumUrls.add(albumUrl);
    albumQueue.push({
      url: albumUrl,
      title: (typeof rawAlbum === 'object' && rawAlbum?.title) || getEromeTargetLabel(albumUrl),
      sourceUrl,
      sourceTitle: sourceTitle || getEromeTargetLabel(sourceUrl)
    });
  }

  function addScrapedGroups(groups) {
    (groups || []).forEach(group => {
      const groupKey = group.url || `${group.sourceUrl || 'erome'}:${allGroups.length}`;

      if (groupKey && seenGroupUrls.has(groupKey)) return;

      const videos = [];

      (group.videos || []).forEach(videoUrl => {
        if (!videoUrl || seenVideoUrls.has(videoUrl)) return;

        seenVideoUrls.add(videoUrl);
        videos.push(videoUrl);
      });

      if (!videos.length) return;

      if (groupKey) seenGroupUrls.add(groupKey);
      allGroups.push({
        ...group,
        videos
      });
      totalVideos += videos.length;
    });
  }

  function updateDiscoveryProgress(targetIndex, target, page, pageCount, note) {
    const artistText = `artist ${targetIndex + 1}/${targets.length}`;
    const pageText = pageCount > 1 ? `page ${page}/${pageCount}` : 'single page';
    const label = getEromeTargetLabel(target);

    updateEromeProgress({
      title: 'Scraping Erome',
      detail: `${artistText} - ${label} - finding albums - ${pageText}${note ? ` - ${note}` : ''} - ${albumQueue.length} albums`,
      completed: completedPages,
      total: totalPages,
      videos: totalVideos
    });
  }

  function updateAlbumProgress(album, note) {
    updateEromeProgress({
      title: 'Scraping Erome Albums',
      detail: `album ${completedAlbums}/${Math.max(1, albumQueue.length)} - ${album?.title || getEromeTargetLabel(album?.url || '')}${note ? ` - ${note}` : ''}`,
      completed: completedAlbums,
      total: Math.max(1, albumQueue.length),
      videos: totalVideos
    });
  }

  function publishScrapedGroups(note = 'loading', force = false) {
    if (!allGroups.length || importedGroupCount >= allGroups.length) {
      return { urls: [], metadata: [], events: [] };
    }

    if (!force && !eromeCardsStarted && totalVideos < BATCH_SIZE && completedAlbums < albumQueue.length) {
      return { urls: [], metadata: [], events: [] };
    }

    let imported;

    if (!eromeCardsStarted) {
      rememberEromeArtistRecordsFromVideoGroups(allGroups);

      imported = cacheEromeCardImport(allGroups, base);
      importedGroupCount = allGroups.length;
      eromeCardsStarted = true;

      closeEromeHelper();
      setEromeTwentyCardMode(true);
      window.PongEromeAutoAdvanceOnce = true;
      window.PongLoadAllVideosOnce = false;
      loadVideosButton.click();
      showSortingIndicator(`Loaded first ${imported.urls.length} Erome videos. Continuing in background...`);
    } else {
      const newGroups = allGroups.slice(importedGroupCount);

      if (newGroups.length) {
        rememberEromeArtistRecordsFromVideoGroups(newGroups);
      }

      imported = appendEromeGroupsToCurrentCards(newGroups, base);
      importedGroupCount = allGroups.length;
    }

    updateEromeProgress({
      title: 'Erome Background Load',
      detail: `${allVideoUrls.length || totalVideos} videos available - ${getEromeReadyAlbumBufferCount()}/${EROME_READY_ALBUM_BUFFER_TARGET} ready albums - ${completedAlbums}/${Math.max(1, albumQueue.length)} albums ${note}`,
      completed: completedAlbums,
      total: Math.max(1, albumQueue.length),
      videos: allVideoUrls.length || totalVideos
    });

    return imported;
  }

  function discoveryPageKey(target, page) {
    return `${normalizeEromeProfileSaveUrl(target) || target}|${page}`;
  }

  function markDiscoveryPageCompleted(target, page) {
    const key = discoveryPageKey(target, page);

    if (completedDiscoveryPageKeys.has(key)) return false;

    completedDiscoveryPageKeys.add(key);
    completedPages++;
    return true;
  }

  updateEromeProgress({
    title: 'Scraping Erome',
    detail: `0/${targets.length} artists queued`,
    completed: 0,
    total: totalPages,
    videos: 0
  });

  for (let i = 0; i < targets.length; i++) {
    const target = targets[i];
    const albumTarget = isEromeAlbumLaunchUrl(target);
    const targetSaveUrl = normalizeEromeProfileSaveUrl(target);
    const savedOverride = window.PongSavedEromeAlbumQueueOverride;
    const savedOverrideMatches = savedOverride &&
      targetSaveUrl &&
      normalizeEromeProfileSaveUrl(savedOverride.targetUrl || '') === targetSaveUrl &&
      Array.isArray(savedOverride.albums) &&
      savedOverride.albums.length;
    let pageCount = 1;
    const albumsBeforeTarget = albumQueue.length;

    updateDiscoveryProgress(i, target, 1, pageCount, 'starting');

    try {
      if (savedOverrideMatches) {
        savedOverride.albums.forEach(album => {
          addAlbumToQueue(album, targetSaveUrl, savedOverride.label || getEromeTargetLabel(targetSaveUrl));
        });
        completedPages++;
        updateDiscoveryProgress(i, target, 1, pageCount, 'saved list');
        continue;
      }

      if (albumTarget) {
        addAlbumToQueue(target, target, getEromeTargetLabel(target));
        completedPages++;
        updateDiscoveryProgress(i, target, 1, pageCount, 'queued');
        continue;
      }

      const firstUrl = eromeProfilePageUrl(target, 1);
      const firstData = await fetchEromeAlbumListData(base, firstUrl, {
        attempts: 2,
        timeoutMs: EROME_FETCH_TIMEOUT_MS,
        fast: true
      });
      const sourceTitle = firstData?.title || getEromeTargetLabel(target);

      pageCount = Math.max(1, Number(firstData.profilePageCount || 1));
      totalPages += Math.max(0, pageCount - 1);
      (firstData.albums || []).forEach(album => addAlbumToQueue(album, target, sourceTitle));
      completedPages++;
      updateDiscoveryProgress(i, target, 1, pageCount);

      const remainingPages = Array.from({ length: Math.max(0, pageCount - 1) }, (_, pageIndex) => pageIndex + 2);

      await eromePool(remainingPages, EROME_PROFILE_PAGE_CONCURRENCY, async page => {
        const pageUrl = eromeProfilePageUrl(target, page);

        updateDiscoveryProgress(i, target, page, pageCount, 'loading');

        try {
          const pageData = await fetchEromeAlbumListData(base, pageUrl, {
            attempts: 1,
            timeoutMs: EROME_FETCH_TIMEOUT_MS,
            fast: true
          });

          (pageData.albums || []).forEach(album => addAlbumToQueue(album, target, sourceTitle));
          markDiscoveryPageCompleted(target, page);
          updateDiscoveryProgress(i, target, page, pageCount);
          return true;
        } catch (pageErr) {
          discoveryRetryQueue.push({
            targetIndex: i,
            target,
            page,
            pageCount,
            sourceTitle
          });
          console.warn('Erome album discovery page failed:', pageUrl, pageErr);
          return false;
        }
      });

      if (albumQueue.length === albumsBeforeTarget && pageCount <= 1) {
        failures.push(target);
      }
    } catch (err) {
      updateDiscoveryProgress(i, target, pageCount, pageCount, 'failed');
      firstPageRetryQueue.push({
        targetIndex: i,
        target
      });
      console.warn('Erome scrape failed:', target, err);
    }
  }

  const completedAlbumUrls = new Set();
  const failedAlbums = [];

  async function scrapeEromeAlbumOnce(album, note) {
    try {
      updateAlbumProgress(album, note || 'loading');

      const data = await fetchEromeScrapeData(base, album.url, {
        attempts: 1,
        timeoutMs: note === 'final retry' ? EROME_FINAL_RETRY_TIMEOUT_MS : EROME_FETCH_TIMEOUT_MS,
        fast: note !== 'final retry'
      });
      const groups = buildEromeImportGroups(data, album.url).map(group => ({
        ...group,
        url: group.url || album.url,
        title: group.title || album.title,
        sourceUrl: album.sourceUrl || album.url,
        sourceTitle: album.sourceTitle || getEromeTargetLabel(album.sourceUrl || album.url)
      }));

      addScrapedGroups(groups);

      if (!completedAlbumUrls.has(album.url)) {
        completedAlbumUrls.add(album.url);
        completedAlbums++;
      }

      publishScrapedGroups('loaded');
      updateAlbumProgress(album);
      return true;
    } catch (err) {
      console.warn('Erome album scrape failed:', album.url, err);
      return false;
    }
  }

  if (albumQueue.length) {
    rememberEromeArtistRecordsFromAlbums(albumQueue);

    showSortingIndicator(`Found ${albumQueue.length} Erome albums. Scraping videos...`);
    updateAlbumProgress(albumQueue[0], 'starting');

    let nextAlbumIndex = 0;

    while (nextAlbumIndex < albumQueue.length && !eromeCardsStarted) {
      const batch = albumQueue.slice(nextAlbumIndex, nextAlbumIndex + EROME_INITIAL_ALBUM_BATCH_SIZE);

      nextAlbumIndex += batch.length;

      await eromePool(batch, Math.min(EROME_ALBUM_SCRAPE_CONCURRENCY, batch.length), async album => {
        const ok = await scrapeEromeAlbumOnce(album, 'loading');

        if (!ok) failedAlbums.push(album);
      });
    }

    const backgroundAlbums = albumQueue.slice(nextAlbumIndex);

    if (backgroundAlbums.length) {
      updateEromeProgress({
        title: 'Erome Background Load',
        detail: `${backgroundAlbums.length} albums left - keeping ${EROME_READY_ALBUM_BUFFER_TARGET} ready`,
        completed: completedAlbums,
        total: Math.max(1, albumQueue.length),
        videos: totalVideos
      });
    }

    await eromePool(backgroundAlbums, EROME_BACKGROUND_ALBUM_CONCURRENCY, async album => {
      await waitForEromeBackgroundScrapeSlot();

      const ok = await scrapeEromeAlbumOnce(album, 'background');

      if (!ok) failedAlbums.push(album);
    });
  }

  const albumCountBeforeFinalRetry = albumQueue.length;
  const finalRetryNeeded = firstPageRetryQueue.length || discoveryRetryQueue.length || failedAlbums.length;

  if (finalRetryNeeded) {
    updateEromeProgress({
      title: 'Final Erome Retry',
      detail: 'Retrying failed pages and albums once',
      completed: completedAlbums,
      total: Math.max(1, albumQueue.length),
      videos: totalVideos
    });
  }

  if (firstPageRetryQueue.length) {
    const failedFirstPages = await eromeRetryOnce(
      firstPageRetryQueue,
      EROME_BACKGROUND_PROFILE_CONCURRENCY,
      async item => {
        const firstUrl = eromeProfilePageUrl(item.target, 1);

        updateDiscoveryProgress(item.targetIndex, item.target, 1, 1, 'final retry');
        await waitForEromeBackgroundScrapeSlot();

        try {
          const firstData = await fetchEromeAlbumListData(base, firstUrl, {
            attempts: 1,
            timeoutMs: EROME_FINAL_RETRY_TIMEOUT_MS,
            fast: false
          });
          const sourceTitle = firstData?.title || getEromeTargetLabel(item.target);
          const pageCount = Math.max(1, Number(firstData.profilePageCount || 1));

          totalPages += Math.max(0, pageCount - 1);
          (firstData.albums || []).forEach(album => addAlbumToQueue(album, item.target, sourceTitle));
          markDiscoveryPageCompleted(item.target, 1);
          updateDiscoveryProgress(item.targetIndex, item.target, 1, pageCount, 'final retry ok');

          Array.from({ length: Math.max(0, pageCount - 1) }, (_, pageIndex) => pageIndex + 2)
            .forEach(page => {
              discoveryRetryQueue.push({
                targetIndex: item.targetIndex,
                target: item.target,
                page,
                pageCount,
                sourceTitle
              });
            });

          return true;
        } catch (err) {
          console.warn('Erome first page final retry failed:', item.target, err);
          return false;
        }
      },
      pending => {
        updateEromeProgress({
          title: 'Final Erome Retry',
          detail: `${pending.length} artist first pages`,
          completed: completedPages,
          total: totalPages,
          videos: totalVideos
        });
      }
    );

    failedFirstPages.forEach(item => {
      markDiscoveryPageCompleted(item.target, 1);
      failures.push(item.target);
      updateDiscoveryProgress(item.targetIndex, item.target, 1, 1, 'failed final retry');
    });
  }

  if (discoveryRetryQueue.length) {
    const failedDiscoveryPages = await eromeRetryOnce(
      discoveryRetryQueue,
      EROME_BACKGROUND_PROFILE_CONCURRENCY,
      async item => {
        const pageUrl = eromeProfilePageUrl(item.target, item.page);

        updateDiscoveryProgress(item.targetIndex, item.target, item.page, item.pageCount, 'final retry');
        await waitForEromeBackgroundScrapeSlot();

        try {
          const pageData = await fetchEromeAlbumListData(base, pageUrl, {
            attempts: 1,
            timeoutMs: EROME_FINAL_RETRY_TIMEOUT_MS,
            fast: false
          });

          (pageData.albums || []).forEach(album => addAlbumToQueue(album, item.target, item.sourceTitle));
          markDiscoveryPageCompleted(item.target, item.page);
          updateDiscoveryProgress(item.targetIndex, item.target, item.page, item.pageCount, 'final retry ok');
          return true;
        } catch (pageErr) {
          console.warn('Erome final retry page failed:', pageUrl, pageErr);
          return false;
        }
      },
      pending => {
        updateEromeProgress({
          title: 'Final Erome Retry',
          detail: `${pending.length} profile pages`,
          completed: completedPages,
          total: totalPages,
          videos: totalVideos
        });
      }
    );

    failedDiscoveryPages.forEach(item => {
      const pageUrl = eromeProfilePageUrl(item.target, item.page);

      markDiscoveryPageCompleted(item.target, item.page);
      failures.push(pageUrl);
      updateDiscoveryProgress(item.targetIndex, item.target, item.page, item.pageCount, 'failed final retry');
    });
  }

  const finalAlbumRetrySeen = new Set();
  const finalAlbumRetryQueue = [];

  failedAlbums.concat(albumQueue.slice(albumCountBeforeFinalRetry)).forEach(album => {
    if (!album?.url || completedAlbumUrls.has(album.url) || finalAlbumRetrySeen.has(album.url)) return;

    finalAlbumRetrySeen.add(album.url);
    finalAlbumRetryQueue.push(album);
  });

  if (finalAlbumRetryQueue.length) {
    const failedFinalAlbums = await eromeRetryOnce(
      finalAlbumRetryQueue,
      EROME_BACKGROUND_ALBUM_CONCURRENCY,
      async album => {
        await waitForEromeBackgroundScrapeSlot();
        return scrapeEromeAlbumOnce(album, 'final retry');
      },
      pending => {
        updateEromeProgress({
          title: 'Final Erome Retry',
          detail: `${pending.length} albums`,
          completed: completedAlbums,
          total: Math.max(1, albumQueue.length),
          videos: totalVideos
        });
      }
    );

    failedFinalAlbums.forEach(album => {
      if (!completedAlbumUrls.has(album.url)) {
        completedAlbumUrls.add(album.url);
        completedAlbums++;
        updateAlbumProgress(album, 'failed final retry');
      }

      failures.push(album.url);
    });
  }

  if (!albumQueue.length) {
    hideEromeProgress();
    alert('No albums found on those Erome pages.');
    return;
  }

  if (albumQueue.length > albumCountBeforeFinalRetry) {
    rememberEromeArtistRecordsFromAlbums(albumQueue);
  }

  if (!totalVideos) {
    hideEromeProgress();
    alert('No videos found on those Erome pages.');
    return;
  }

  try {
    const imported = publishScrapedGroups('complete', true);
    const loadedVideoCount = allVideoUrls.length || imported.urls.length || totalVideos;
    const loadedBatchCount = pasteEvents.length || imported.events.length || allGroups.length;

    showSortingIndicator(
      'Loaded ' + loadedVideoCount + ' Erome videos in ' + loadedBatchCount + ' batches'
      + (failures.length ? ' (' + failures.length + ' page failed)' : '')
    );
    updateEromeProgress({
      title: 'Erome Loaded',
      detail: `${loadedBatchCount} batches ready`,
      completed: albumQueue.length,
      total: albumQueue.length,
      videos: loadedVideoCount
    });
    hideEromeProgress(1400);
  } catch (err) {
    hideEromeProgress();
    alert('Erome scrape failed: ' + (err && err.message ? err.message : err));
  }
}

function normalizeAuthUrl(rawUrl) {
  const trimmed = String(rawUrl || '').trim();
  const candidate = trimmed || DEFAULT_AUTH_URL;
  const withScheme = /^[a-z][a-z0-9+.-]*:/i.test(candidate) ? candidate : `https://${candidate}`;

  try {
    return new URL(withScheme).href;
  } catch (_) {
    return DEFAULT_AUTH_URL;
  }
}

function openAuthBrowser(rawUrl) {
  const ov=document.getElementById('auth-helper'),ct=document.getElementById('auth-iframe-container');
  const input=document.getElementById('auth-url-input');
  const url=normalizeAuthUrl(rawUrl || (input ? input.value : DEFAULT_AUTH_URL));
  if(input) input.value=url;
  ov.style.display='block';
  ct.innerHTML='';
  const ifr=document.createElement('iframe');
  ifr.src=url;
  ifr.style.width='100%';
  ifr.style.height='100%';
  ct.appendChild(ifr);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  (function() {
    const overlay = document.getElementById('pong-overlay');
    const hotspot = document.getElementById('pong-hotspot');
    const canvas  = document.getElementById('pong-canvas');
    if (!overlay || !canvas) return;

    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) return;
    ctx.imageSmoothingEnabled = false;

    const PAD_H = 70, PAD_W = 10, BALL_R = 7;
    let ly = canvas.height/2 - PAD_H/2;
    let ry = canvas.height/2 - PAD_H/2;
    let bx = canvas.width/2, by = canvas.height/2;
    let vx = 4.5, vy = 3.2;
    let ls = 0, rs = 0;
    let running = true;
    let lastFrameTime = performance.now();
    let rafId = 0;

    function draw() {
      if (!running) return;
      const now = performance.now();
      const frameScale = Math.max(0.5, Math.min(1.8, (now - lastFrameTime) / 16.67));
      lastFrameTime = now;

      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.setLineDash([10, 14]);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width/2, 0);
      ctx.lineTo(canvas.width/2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(ls, canvas.width/2 - 60, 70);
      ctx.fillText(rs, canvas.width/2 + 60, 70);

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      roundRect(ctx, 18, ly, PAD_W, PAD_H, 4);
      ctx.fill();
      ctx.beginPath();
      roundRect(ctx, canvas.width - 28, ry, PAD_W, PAD_H, 4);
      ctx.fill();

      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(bx, by, BALL_R, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.shadowBlur = 0;

      bx += vx * frameScale;
      by += vy * frameScale;

      if (by - BALL_R < 0) {
        by = BALL_R;
        vy = Math.abs(vy);
      }

      if (by + BALL_R > canvas.height) {
        by = canvas.height-BALL_R;
        vy = -Math.abs(vy);
      }

      const speed = 3.2 * frameScale;
      const lCenter = ly + PAD_H/2;
      const rCenter = ry + PAD_H/2;

      if (lCenter < by - 6) ly = Math.min(ly + speed, canvas.height - PAD_H);
      if (lCenter > by + 6) ly = Math.max(ly - speed, 0);
      if (rCenter < by - 6) ry = Math.min(ry + speed, canvas.height - PAD_H);
      if (rCenter > by + 6) ry = Math.max(ry - speed, 0);

      if (bx - BALL_R < 28 + PAD_W && by > ly && by < ly + PAD_H && vx < 0) {
        vx = Math.abs(vx) * 1.04;
        vy += (by - (ly + PAD_H/2)) * 0.06;
        bx = 28 + PAD_W + BALL_R;
      }

      if (bx + BALL_R > canvas.width - 28 && by > ry && by < ry + PAD_H && vx > 0) {
        vx = -Math.abs(vx) * 1.04;
        vy += (by - (ry + PAD_H/2)) * 0.06;
        bx = canvas.width - 28 - BALL_R;
      }

      const spd = Math.sqrt(vx*vx+vy*vy);
      if (spd > 12) {
        vx = vx/spd*12;
        vy = vy/spd*12;
      }

      if (bx < 0) {
        rs++;
        reset();
      }

      if (bx > canvas.width) {
        ls++;
        reset();
      }

      rafId = requestAnimationFrame(draw);
    }

    function reset() {
      bx = canvas.width/2;
      by = canvas.height/2;
      vx = (Math.random()>0.5?1:-1) * 4.5;
      vy = (Math.random()>0.5?1:-1) * 3.2;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.lineTo(x+w-r, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r);
      ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h);
      ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r);
      ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath();
    }

    rafId = requestAnimationFrame(draw);

    function dismiss() {
      running = false;
      cancelAnimationFrame(rafId);
      overlay.classList.add('hidden');
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 600);
    }

    let tapCount = 0;
    let tapTimer = null;

    function handleHotspot(e) {
      e.preventDefault();
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount >= 3) {
        tapCount = 0;
        dismiss();
      } else {
        tapTimer = setTimeout(() => {
          tapCount = 0;
        }, 2000);
      }
    }

    hotspot.addEventListener('click', handleHotspot);
    hotspot.addEventListener('touchend', handleHotspot);
  })();

  try {
    window.autoplayEnabled = localStorage.getItem('pong_autoplay') !== '0';
  } catch(_) {
    window.autoplayEnabled = true;
  }

  createGearButton();
  createUnwatchedVideosButton();
  updatePasteNavigationButton();
  createSaveButtons();
  setupMobileAudioUnlock();
  setupDeckSwipeController();

  if (loadSession()) {
    console.log(`[Session] Restoring ${allVideoUrls.length} videos, batch ${currentBatch}, index ${currentVideoIndex}`);
    const savedBatch = currentBatch;
    const restoreBatchSize = getCurrentBatchSize();
    const savedIndex = currentVideoIndex % restoreBatchSize;
    if (activePlaybackRange) {
      activePlaybackRange.offset = Math.max(0, Number(
        Number.isFinite(activePlaybackRange.currentOffset)
          ? activePlaybackRange.currentOffset
          : Number(activePlaybackRange.offset || 0) - restoreBatchSize
      ));
      currentBatch = Math.max(0, savedBatch - 1);
    } else {
      currentBatch = Math.max(0, savedBatch - 1);
    }
    updatePasteNavigationButton();
    loadNextBatch(savedIndex);
  }

  let lastTap=0;
  document.addEventListener('click',e=>{
    if(e.target.closest('.video-wrapper'))return;
    const now=Date.now();
    if(now-lastTap<300&&now-lastTap>0)toggleControls();
    lastTap=now;
  });

  let skippedRecycleTimer = null;
  let lastDeckScrollSessionSaveAt = 0;
  videoContainer.addEventListener('scroll', () => {
    if (DECK_MODE_ENABLED) {
      const now = Date.now();

      if (now - lastDeckScrollSessionSaveAt > 2500) {
        lastDeckScrollSessionSaveAt = now;
        scheduleSessionSave(1400);
      }
      return;
    }

    window.lastScrollTime = Date.now();
    clearTimeout(skippedRecycleTimer);
    skippedRecycleTimer = setTimeout(() => {
      skippedRecycleTimer = null;
      recycleSkippedVideosBelow();
    }, 650);
    scheduleSessionSave(600);
  });
});

// ─── Scroll bar ──────────────────────────────────────────────────────────────
(function() {
  const track = document.createElement('div');
  track.id = 'scroll-bar-track';
  const thumb = document.createElement('div');
  thumb.id = 'scroll-bar-thumb';
  track.appendChild(thumb);
  document.body.appendChild(track);

  let hideTimer = null;

  function updateThumb() {
    const vc = document.getElementById('video-container');
    if (!vc) return;

    if (Date.now() < scrollThumbSuppressedUntil) {
      thumb.classList.remove('visible');
      return;
    }

    const totalH = vc.scrollHeight;
    const viewH  = vc.clientHeight;

    if (totalH <= viewH) {
      thumb.classList.remove('visible');
      return;
    }

    const ratio     = viewH / totalH;
    const thumbH    = Math.max(20, viewH * ratio);
    const scrollPct = vc.scrollTop / (totalH - viewH);
    const topPos    = scrollPct * (viewH - thumbH);

    thumb.style.height = thumbH + 'px';
    thumb.style.top    = topPos + 'px';
    thumb.classList.add('visible');

    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => thumb.classList.remove('visible'), 1200);
  }

  function attachScrollBar() {
    const vc = document.getElementById('video-container');
    if (!vc) {
      setTimeout(attachScrollBar, 200);
      return;
    }
    vc.addEventListener('scroll', updateThumb, { passive: true });
  }

  attachScrollBar();
})();
