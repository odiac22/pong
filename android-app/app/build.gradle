plugins { id 'com.android.application' }

def pongObserverPair = System.getenv('PONG_OBSERVER_PAIR') ?: 'OBSERVER_PAIR_PLACEHOLDER'
def escapedObserverPair = pongObserverPair.replace('\\', '\\\\').replace('"', '\\"')
def pongGatewayUrl = System.getenv('PONG_GATEWAY_URL') ?: 'http://192.168.1.124:8787/pong'
def pongGatewayToken = System.getenv('PONG_GATEWAY_TOKEN') ?: ''
def escapedGatewayUrl = pongGatewayUrl.replace('\\', '\\\\').replace('"', '\\"')
def escapedGatewayToken = pongGatewayToken.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.odiac22.pong'
    compileSdk 35
    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 2801
        versionName '28.01'
        buildConfigField 'String', 'OBSERVER_PAIR', "\"${escapedObserverPair}\""
        buildConfigField 'String', 'PONG_GATEWAY_URL', "\"${escapedGatewayUrl}\""
        buildConfigField 'String', 'PONG_GATEWAY_TOKEN', "\"${escapedGatewayToken}\""
    }
    flavorDimensions 'instance'
    productFlavors {
        pong1 {
            dimension 'instance'; applicationId 'com.odiac22.pong1'
            resValue 'string', 'app_name', 'Pong 1'
            buildConfigField 'String', 'INSTANCE', '"1"'
        }
        pong2 {
            dimension 'instance'; applicationId 'com.odiac22.pong2'
            resValue 'string', 'app_name', 'Pong 2'
            buildConfigField 'String', 'INSTANCE', '"2"'
        }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv('PONG_KEYSTORE_PATH') ?: 'missing.jks')
            storePassword System.getenv('PONG_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('PONG_KEY_ALIAS') ?: 'pong'
            keyPassword System.getenv('PONG_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
}

gradle.taskGraph.whenReady { graph ->
    def createsReleaseApk = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release') &&
            (task.name.toLowerCase().contains('assemble') || task.name.toLowerCase().contains('bundle'))
    }
    if (createsReleaseApk && pongObserverPair == 'OBSERVER_PAIR_PLACEHOLDER') {
        throw new GradleException('Release APK requires PONG_OBSERVER_PAIR; refusing to build disconnected Pong diagnostics.')
    }
    if (createsReleaseApk && (!pongGatewayUrl.startsWith('https://') || !pongGatewayToken)) {
        throw new GradleException('Release APK requires the authenticated HTTPS Pong gateway.')
    }
}
