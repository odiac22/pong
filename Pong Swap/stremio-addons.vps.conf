server {
    server_name aiostreams.217-77-13-143.sslip.io;

    client_max_body_size 5m;
    include /etc/nginx/snippets/pong-observer.conf;
    include /etc/nginx/snippets/pong-apk-upload.conf;
    include /etc/nginx/snippets/pong-face-upload.conf;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    location /subdl/ {
        proxy_pass http://127.0.0.1:7070/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location = /downloads/NFL_Fantasy_Live.xlsx {
        alias /var/www/nfl-downloads/NFL_Fantasy_Live.xlsx;
        default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
        add_header Cache-Control "no-cache, private" always;
        add_header Content-Disposition 'attachment; filename="NFL_Fantasy_Live.xlsx"' always;
    }

    location = /downloads/NFL_Fantasy_Draft_Tracker.xlsm {
        alias /var/www/nfl-downloads/NFL_Fantasy_Draft_Tracker.xlsm;
        default_type application/vnd.ms-excel.sheet.macroEnabled.12;
        add_header Cache-Control "no-cache, private" always;
        add_header Content-Disposition 'attachment; filename="NFL_Fantasy_Draft_Tracker.xlsm"' always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/aiostreams.217-77-13-143.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiostreams.217-77-13-143.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

